<title>Ruta Spanish</title>
<meta name="claude:viewport-fit-sides" content="cover">

<!-- Motion (motion.dev) animation library. Pinned version; the app falls back to built-in animations if it fails to load. -->
<script defer src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
/* Theme boot: runs before first paint so there is no flash of the wrong theme.
   'ruta-theme' is 'light', 'dark' or absent (follow the device). */
(function(){ try { var p = localStorage.getItem('ruta-palette') || 'mango'; document.documentElement.setAttribute('data-palette', p); } catch(e){ document.documentElement.setAttribute('data-palette', 'mango'); }
  try { var t = localStorage.getItem('ruta-theme');
  if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-ruta-theme', ''); } } catch(e){} })();
</script>
<style>
/* =====================================================================
   RUTA DESIGN SYSTEM · "Playful" theme
   Layer 1  primitives   raw colour ramps, never used by components
   Layer 2  semantic     what a colour is FOR; the only layer themes remap
   Layer 3  components   buttons, cards, quiz options… read semantic tokens only
   Theme switching: light is the default. Dark applies when the device is dark
   (and the user hasn't forced light), or when <html data-theme="dark">.
   ===================================================================== */

/* ---------- 1. primitives ---------- */
:root{
  --lime-100:#E4F9D4; --lime-400:#6BD83A; --lime-500:#4CC51C; --lime-600:#3BA312; --lime-900:#1B3A10;

  --rose-100:#FFE1E1; --rose-400:#FF6B6E; --rose-500:#F0454A; --rose-600:#C92F35; --rose-900:#4A1A1D;
  --grape-400:#B28CFF; --grape-500:#9B6BFF; --grape-600:#7A4CE0;
  --pink-400:#FF8CC4; --pink-500:#F4609F;
  --ink-50:#FFFFFF; --ink-100:#F4F7F9; --ink-200:#E6ECF0; --ink-300:#CDD6DD; --ink-500:#7E8C97; --ink-700:#4B5963; --ink-800:#38444D;

}

/* ---------- 2. semantic tokens: LIGHT (default) ---------- */
:root{
  --bg:var(--ink-50); --surface:var(--ink-50); --sunk:var(--ink-100); --hover:var(--ink-100);
  --ink:var(--ink-800); --muted:var(--ink-500); --line:var(--ink-200); --line-strong:var(--ink-300);
  --primary:var(--lime-500); --primary-shade:var(--lime-600); --on-primary:#FFFFFF; --primary-soft:var(--lime-100);
  --secondary:var(--sky-500); --secondary-shade:var(--sky-600); --on-secondary:#FFFFFF; --secondary-soft:var(--sky-100);
  --gold:var(--sun-500); --gold-shade:var(--sun-600); --streak:var(--tang-500);

}
/* ---------- 2b. semantic tokens: DARK ---------- */

/* ---------- 2c. shape, type, motion (theme-independent) ---------- */
:root{
  --font:"Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:var(--font); --body:var(--font);
  --r-sm:10px; --r:16px; --r-lg:20px; --r-pill:999px;
  --bw:2px;          /* every outline is 2px */
  --press:4px;       /* depth of the 3D "lip" under buttons and cards */
  --lift:2px;        /* how far interactive cards rise on hover */
  --t-fast:.08s; --t:.18s;
  /* legacy aliases used by older component code */
  --primary-ink:var(--primary);
  --accent:var(--primary); --accent-2:var(--primary-shade); --on-accent:var(--on-primary); --accent-soft:var(--primary-soft); --sun:var(--gold);
}

/* ---------- 3. base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;font-size:16.5px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent;
  transition:background-color var(--t), color var(--t)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--secondary);outline-offset:3px;border-radius:12px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:900}
i{font-style:normal}
main{max-width:620px;margin:0 auto;padding-block:16px 120px}
body.in-lesson main{padding-bottom:160px}

/* ---------- 4. buttons: chunky, 3D lip, press-down on click ---------- */
.btn{--btn-bg:var(--primary);--btn-fg:var(--on-primary);--btn-shade:var(--primary-shade);--btn-border:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:var(--bw) solid var(--btn-border);border-radius:var(--r);padding:13px 22px;
  background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 var(--press) 0 var(--btn-shade);
  font-weight:900;font-size:15px;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;
  transition:transform var(--t-fast), box-shadow var(--t-fast), filter var(--t), background-color var(--t);
  margin-bottom:var(--press)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(var(--press));box-shadow:0 0 0 var(--btn-shade)}
.btn.primary{--btn-bg:var(--primary);--btn-fg:var(--on-primary);--btn-shade:var(--primary-shade)}
.btn.secondary,.btn.soft{--btn-bg:var(--secondary);--btn-fg:var(--on-secondary);--btn-shade:var(--secondary-shade)}
.btn.soft{--btn-bg:var(--secondary-soft);--btn-fg:var(--secondary);--btn-shade:var(--secondary);--btn-border:var(--secondary)}
.btn.ghost{--btn-bg:var(--surface);--btn-fg:var(--ink);--btn-shade:var(--line);--btn-border:var(--line)}
.btn.danger{--btn-bg:var(--bad);--btn-fg:#FFFFFF;--btn-shade:var(--bad-shade)}
.btn.danger-ghost{--btn-bg:var(--surface);--btn-fg:var(--bad);--btn-shade:var(--bad);--btn-border:var(--bad)}
.btn.text{--btn-bg:transparent;--btn-fg:var(--secondary);--btn-shade:transparent;padding:8px 10px;margin-bottom:0}
.btn.text:active{transform:none}
.btn:disabled{--btn-bg:var(--line);--btn-fg:var(--muted);--btn-shade:transparent;--btn-border:transparent;filter:none}
.btn.ghost:disabled{--btn-bg:var(--surface);--btn-border:var(--line);border-style:dashed}
.btn.small{padding:9px 15px;font-size:13px;border-radius:var(--r-sm)}
.btn.wide{width:100%}
.icon-btn{--ib-bg:var(--secondary-soft);--ib-fg:var(--secondary);--ib-shade:var(--secondary);
  display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;flex:none;
  border:var(--bw) solid var(--ib-shade);background:var(--ib-bg);color:var(--ib-fg);box-shadow:0 3px 0 var(--ib-shade);
  transition:transform var(--t-fast), box-shadow var(--t-fast)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ib-shade)}
.icon-btn svg{width:21px;height:21px}
.icon-btn.big{--ib-bg:var(--secondary);--ib-fg:var(--on-secondary);--ib-shade:var(--secondary-shade);width:54px;height:54px;border-color:transparent}
.icon-btn.big svg{width:26px;height:26px}
.icon-btn.tiny{width:32px;height:32px;box-shadow:0 2px 0 var(--ib-shade)}
.icon-btn.tiny svg{width:16px;height:16px}

/* ---------- 5. cards ---------- */
/* static card: thick outline, flat */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:18px}
/* interactive "quiz card": thick outline + 3D lip, lifts on hover, sinks on press, recolours when selected */
.opt,.pair,.tile,.chip,.key,.pal,.narr,.nudge,.tile-card,.unit{
  --qc-border:var(--line);--qc-shade:var(--line);--qc-bg:var(--surface);--qc-fg:var(--ink);
  background:var(--qc-bg);color:var(--qc-fg);border:var(--bw) solid var(--qc-border);border-radius:var(--r);
  box-shadow:0 var(--press) 0 var(--qc-shade);
  transition:transform var(--t-fast), box-shadow var(--t-fast), background-color var(--t), border-color var(--t), color var(--t)}
:is(.opt,.pair,.tile,.chip,.key,.pal,.nudge,.tile-card):not(:disabled):hover{transform:translateY(calc(var(--lift) * -1));box-shadow:0 calc(var(--press) + var(--lift)) 0 var(--qc-shade);--qc-bg:var(--hover)}
:is(.opt,.pair,.tile,.chip,.key,.nudge,.tile-card):not(:disabled):active{transform:translateY(var(--press));box-shadow:0 0 0 var(--qc-shade)}
:is(.opt,.pair,.tile,.chip,.key,.pal)[aria-pressed="true"],.narr.on{--qc-border:var(--secondary);--qc-shade:var(--secondary);--qc-bg:var(--secondary-soft);--qc-fg:var(--secondary)}
:is(.opt,.pair).right{--qc-border:var(--good);--qc-shade:var(--good);--qc-bg:var(--good-bg);--qc-fg:var(--good)}
:is(.opt,.pair).wrong{--qc-border:var(--bad);--qc-shade:var(--bad);--qc-bg:var(--bad-bg);--qc-fg:var(--bad)}
:is(.opt,.pair,.tile):disabled{transform:none}

/* ---------- 6. shared bits ---------- */
.eyebrow{margin:0;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--primary-ink)}
.eyebrow i{letter-spacing:0;text-transform:none;font-weight:700;color:var(--muted)}
.kicker{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cc, var(--primary))}
.kicker::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.kicker i{letter-spacing:0;text-transform:none;font-weight:700;color:var(--muted)}
.small:not(.btn){font-size:14px;font-weight:600;color:var(--muted);margin:0}
.meter{display:block;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--gold);border-radius:7px;transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.c-learn{--cc:var(--c-learn)} .c-remember{--cc:var(--c-remember)} .c-test{--cc:var(--c-test)}
.c-practical{--cc:var(--c-practical)} .c-think{--cc:var(--c-think)} .c-expression{--cc:var(--c-expression)}
.chip{padding:8px 15px;font-size:13px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;border-radius:var(--r-pill);--press:3px}
.chip.on{--qc-border:var(--secondary);--qc-shade:var(--secondary-shade);--qc-bg:var(--secondary);--qc-fg:var(--on-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- 7. top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;color:var(--primary)}
.mark svg{width:100%;height:100%;display:block}
.brand-name{font-size:28px;font-weight:900;letter-spacing:-.01em;line-height:1;color:var(--primary-ink)}
.tag{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:var(--secondary);color:var(--on-secondary);border-radius:8px;padding:4px 8px}
.pills{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border:var(--bw) solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink)}
.pill.streak{color:var(--streak);border-color:transparent;padding-inline:6px}
.pill.lv{color:var(--secondary);border-color:var(--secondary);background:var(--secondary-soft)}
.flame{display:inline-flex} .flame svg{width:20px;height:20px}
.theme-btn{width:38px;height:38px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);transition:transform var(--t-fast), box-shadow var(--t-fast)}
.theme-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.theme-btn svg{width:19px;height:19px}

/* ---------- 8. hero + route ---------- */
.hero{display:grid;gap:12px;text-align:center;justify-items:center;margin-bottom:16px}
.hero-t{font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.1;letter-spacing:-.01em}
.hero-t span{color:var(--primary-ink)}
.route-wrap{width:100%}
.route{width:100%;height:auto;display:block;overflow:visible}
.road{fill:none;stroke:var(--line);stroke-width:16;stroke-linecap:round}
.road-mid{fill:none;stroke:var(--surface);stroke-width:2;stroke-dasharray:6 8}
.road-done{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.7,.2,1)}
.stop{fill:var(--surface);stroke:var(--line-strong);stroke-width:3}
.stop.full{fill:var(--gold);stroke:var(--gold-shade)}
.stop-c{font:900 7px var(--font);fill:var(--muted)}
.stop.full + .stop-c{fill:#3A2A00}
.stop-l{font:800 10.5px var(--font);fill:var(--muted)}
.stop-start{fill:var(--line-strong)}
.me{fill:var(--gold);stroke:var(--surface);stroke-width:3}
.me-glow{fill:var(--gold);opacity:.3;animation:glow 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{transform:scale(1.5);opacity:.1}}
.goal{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.goal b{color:var(--ink);font-variant-numeric:tabular-nums}
.page-head{display:grid;gap:8px;margin-bottom:18px}

/* ---------- 9. daily five ---------- */
.daily{display:grid;gap:14px;margin-bottom:14px}
.daily h2 i{font-size:15px;color:var(--muted)}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.d-btn{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:4px 0;min-width:0}
.d-ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--surface);color:var(--cc);
  box-shadow:0 4px 0 var(--line);transition:transform var(--t-fast), box-shadow var(--t-fast)}
.d-ring svg{width:25px;height:25px}
.d-btn:hover .d-ring{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.d-btn:active .d-ring{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.d-btn.done .d-ring{background:var(--cc);border-color:var(--cc);color:#FFFFFF;box-shadow:0 4px 0 color-mix(in srgb, var(--cc) 70%, #000)}
.d-l{font-size:12.5px;font-weight:900;white-space:nowrap}
.d-es{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
@media (max-width:380px){ .d-ring{width:46px;height:46px} .d-l{font-size:11.5px} }

/* ---------- 10. levels ---------- */
.levels{display:grid;gap:12px;margin-bottom:14px}
.levels-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.levels-head h2,.card-h{font-size:20px;font-weight:900}
.levels-total{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.lvl-row{display:grid;grid-template-columns:auto minmax(92px,auto) minmax(0,1fr) 3.2em;align-items:center;gap:10px}
.band-code{font-weight:900;font-size:12px;letter-spacing:.06em;color:var(--on-secondary);background:var(--secondary);border-radius:8px;padding:3px 7px}
.lvl-name{font-weight:900;display:flex;flex-direction:column;line-height:1.2}
.lvl-name small{font-weight:700;color:var(--muted);font-size:12px}
.lvl-row:not(.active) .lvl-name{color:var(--muted)}
.lvl-bar{display:block;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.lvl-bar span{display:block;height:100%;border-radius:7px;background:var(--primary);transition:width .6s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.lvl-row.full .lvl-bar span{background:var(--gold)}
.lvl-pct{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}

/* ---------- 11. nudge / practise tiles ---------- */
.nudge,.tile-card{width:100%;text-align:left;display:grid;gap:4px;margin-bottom:14px;padding:16px 18px;border-left:6px solid var(--cc) !important;border-radius:var(--r-lg)}
.nudge-t{font-size:21px;font-weight:900;line-height:1.2}
.tile-card:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.grid .tile-card{margin:0}
.big-num{font-size:48px;font-weight:900;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums;color:var(--primary-ink)}
.big-num small{font-size:15px;color:var(--muted)}

/* ---------- 12. unit path ---------- */
.band{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;margin:30px 0 12px}
.band-pct{margin-left:auto;font-size:14px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.path{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.unit{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-lg)}
.unit.current{--qc-border:var(--primary);--qc-shade:var(--primary-shade)}
.unit.locked{--qc-bg:var(--sunk)}
.unit.locked .unit-t,.unit.locked .unit-n{opacity:.55}
.unit-n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;color:var(--muted);box-shadow:0 4px 0 var(--line-strong)}
.unit.current .unit-n{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-shade)}
.unit.mastered .unit-n{background:var(--gold);color:#3A2A00;box-shadow:0 4px 0 var(--gold-shade)}
.unit-t{display:flex;flex-direction:column;min-width:0}
.unit-es{font-size:19px;font-weight:900;line-height:1.25}
.unit-en{color:var(--muted);font-size:14px}
.pips{display:flex;gap:4px;margin-top:7px}
.pips span{width:18px;height:6px;border-radius:3px;background:var(--line)}
.pips span.on{background:var(--gold)}
.unit-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.unit-actions .btn{margin-bottom:var(--press)}
.foot{color:var(--muted);font-size:14px;margin-top:28px;text-align:center}

/* ---------- 13. scroll ---------- */
.filters{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 16px;margin-bottom:4px;scrollbar-width:none;border-bottom:var(--bw) solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.feed{display:grid;gap:16px;padding-top:16px}
.sc-card{display:grid;gap:12px;border-top:6px solid var(--cc);padding:18px 20px 20px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.keep{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.keep svg{width:22px;height:22px;fill:none}
.keep svg path{fill:transparent;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.keep[aria-pressed="true"]{color:var(--gold)}
.keep[aria-pressed="true"] svg path{fill:currentColor}
.sc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc-es{font-size:clamp(26px,7vw,32px);font-weight:900;line-height:1.2;margin:0;min-width:0;overflow-wrap:anywhere}
.sc-en{margin:0;font-size:18px;font-weight:800}
.sc-meta{margin:0;color:var(--muted);font-size:14px}
.sc-title{font-size:24px;font-weight:900;line-height:1.2}
.sc-title.big{font-size:30px}
.sc-text{color:var(--muted);font-weight:600;max-width:62ch}
.sc-text p{margin:0 0 .6em} .sc-text p:last-child{margin:0}
.sc-text i,.sc-text b,.tip i,.tip b{font-weight:900;color:var(--ink)}
.sc-q{margin:0;font-size:18px;font-weight:800}
.sc-ex{margin:0;font-size:18px}
.sc-answer{display:grid;gap:8px;border-top:var(--bw) dashed var(--line);padding-top:12px}
.sc-answer p{margin:0}
.reveal{justify-self:start;background:none;border:0;padding:0;color:var(--cc);font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.more{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}

/* ---------- 14. listen ---------- */
.player{display:grid;gap:14px;margin-bottom:14px}
.lbl{font-weight:900;font-size:14px;color:var(--muted)}
.now{background:var(--sunk);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;min-height:128px;display:grid;align-content:center;gap:6px}
.ls-es{margin:0;font-size:clamp(24px,6.6vw,30px);font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.ls-en{margin:0;color:var(--muted)}
.ls-track{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.ls-track .meter span{background:var(--secondary)}
.ls-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl{width:54px;height:54px}
.big-play{width:80px;height:80px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 0 var(--primary-shade);transition:transform var(--t-fast), box-shadow var(--t-fast)}
.big-play:active{transform:translateY(6px);box-shadow:0 0 0 var(--primary-shade)}
.big-play svg{width:36px;height:36px}
.narrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.narr{display:grid;gap:8px;padding:10px}
.narr-pick{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0;color:inherit}
.narr-pick small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.narr-a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:900;flex:none}
select{width:100%;padding:12px;border-radius:var(--r);border:var(--bw) solid var(--line);background:var(--surface);font-weight:800;box-shadow:0 3px 0 var(--line)}

/* ---------- 15. me ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900}
.stat-v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.stat-v small{font-size:13px;color:var(--muted);font-weight:700}
.settings{display:grid;gap:16px}
.settings h3{font-size:18px;font-weight:900;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.seg .chip{text-align:center}

/* ---------- 16. bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:var(--bw) solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.nav-b{display:grid;justify-items:center;gap:2px;background:none;border:var(--bw) solid transparent;border-radius:14px;padding:6px 2px;font-size:11.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.nav-i{display:inline-flex} .nav-i svg{width:24px;height:24px}
.nav-b.on{color:var(--secondary);background:var(--secondary-soft);border-color:var(--secondary)}

@media (max-width:520px){
  .unit{grid-template-columns:48px minmax(0,1fr)}
  .unit-actions{grid-column:2;justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .lvl-row{grid-template-columns:auto minmax(0,1fr) 3em}
  .lvl-row .lvl-bar{grid-column:1 / -1;grid-row:2}
  .pill{padding:4px 9px}
}

/* ---------- 24. sticky top bar + status widgets ---------- */
.topnav{position:sticky;top:env(safe-area-inset-top, 0px);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;padding-block:10px;background:var(--bg);
  box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax -2px);border-bottom:var(--bw) solid transparent;transition:border-color var(--t)}
.topnav.stuck{border-bottom-color:var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.hud{display:flex;align-items:center;gap:6px;min-width:0}
.hud-item{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 10px;border-radius:var(--r);border:var(--bw) solid transparent;background:transparent;
  font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background-color var(--t), border-color var(--t)}
button.hud-item:hover{background:var(--hover);border-color:var(--line)}
.hud-ico{display:inline-grid;place-items:center;width:24px;height:26px;flex:none}
.hud-ico svg{width:100%;height:100%;overflow:visible}
/* streak flame: pulses gently, grey when there's no streak */
.streak{color:var(--streak)}
.flame-ico .fl-out{fill:var(--streak)}
.flame-ico .fl-in{fill:var(--gold)}
.flame-ico{transform-origin:50% 90%;animation:flame-pulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 0 transparent)}
.streak.lit .flame-ico{animation:flame-pulse 1.8s ease-in-out infinite, flame-glow 1.8s ease-in-out infinite}
@keyframes flame-pulse{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.1,1.14) rotate(-3deg)}60%{transform:scale(.97,1.03) rotate(2deg)}}
@keyframes flame-glow{50%{filter:drop-shadow(0 0 6px color-mix(in srgb, var(--streak) 70%, transparent))}}
.streak.cold{color:var(--muted)}
.streak.cold .flame-ico{animation:none}
.streak.cold .fl-out{fill:var(--line-strong)} .streak.cold .fl-in{fill:var(--line)}
/* gems: faceted diamond, glint sweep, tilts on hover */
.gems{color:var(--secondary)}
.gem-ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1);position:relative;overflow:hidden}
.gem-ico .g-top{fill:#7FD6FF} .gem-ico .g-cap{fill:#B6E9FF} .gem-ico .g-left{fill:#2FA9F0} .gem-ico .g-mid{fill:#1AA6EE} .gem-ico .g-right{fill:#0E7FC4}
.gem-ico .g-glint{fill:none;stroke:#FFFFFF;stroke-width:1.8;stroke-linecap:round;opacity:.9}
.gem-ico::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(75deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);transform:translateX(-120%);animation:gem-shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes gem-shine{0%,70%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.gems:hover .gem-ico,.gems:focus-visible .gem-ico{transform:rotate(-16deg) scale(1.15)}
.lv{color:var(--secondary);font-size:14px;letter-spacing:.02em;height:32px;padding:0 9px;border-color:var(--secondary);background:var(--secondary-soft)}
.lv b{font-size:15px}
/* avatar: round frame, ring shows today's goal progress */
.avatar{--p:0;--ring:var(--primary);position:relative;width:42px;height:42px;border-radius:50%;border:0;padding:3px;flex:none;
  background:conic-gradient(var(--ring) calc(var(--p) * 1%), var(--line) 0);transition:transform var(--t-fast)}
.avatar.goal-done{--ring:var(--gold)}
.avatar:hover{transform:scale(1.06)}
.avatar:active{transform:scale(.95)}
.avatar-in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--secondary-soft);color:var(--secondary);border:2px solid var(--surface);
  font-weight:900;font-size:17px;overflow:hidden}
.avatar-in.is-sol{background:var(--sun-100)}
.avatar-in.is-sol .sol{width:150%;height:150%;margin-top:22%}
.avatar.goal-done::after{content:"";position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.gem-earn{display:flex;align-items:center;gap:6px;margin:0;font-weight:900;color:var(--secondary)}
.gem-earn small{color:var(--muted);font-weight:700}
.done-card.center .gem-earn{justify-content:center}
.sc-counts{display:flex;gap:6px;margin-bottom:10px}
/* graceful shrink on small phones: drop the wordmark, then tighten widgets */
@media (max-width:460px){
  .brand-name{display:none}
  .topnav .tag{display:none}
  .hud{gap:2px}
  .hud-item{padding:0 7px;font-size:16px}
}
@media (max-width:360px){
  .lv{display:none}
  .theme-btn{width:34px;height:34px}
}
/* in a lesson the bar steps aside so the lesson has the screen */
body.in-lesson .topnav{display:none}

/* palette picker */
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.pal{display:grid;justify-items:center;gap:6px;padding:12px 6px 10px}
.pal-sw{display:flex;gap:4px}
.pal-sw span{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pal b{font-size:14px}

/* ---------- 25. speed round ---------- */
.speed{position:relative}
.speed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.speed-head .ex-label{margin-top:4px}
.speed-score{display:grid;justify-items:center;min-width:72px;padding:6px 10px;border:var(--bw) solid var(--c-think);border-radius:var(--r);box-shadow:0 4px 0 var(--c-think);color:var(--c-think)}
.speed-score b{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.speed-score small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.speed-time{font-weight:900;color:var(--muted);display:inline-block}
.speed-time span:first-child{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.speed-board .pair{min-height:58px;font-size:16px}
.speed-go{position:absolute;inset:-8px;z-index:3;display:grid;place-content:center;justify-items:center;gap:6px;background:color-mix(in srgb, var(--bg) 88%, transparent);border-radius:var(--r-lg)}
.speed-sol{width:110px;height:128px}
.speed-count{margin:0;font-size:64px;font-weight:900;color:var(--c-think);line-height:1}
#bar-fill.hurry{background:var(--bad)}
.speed-again{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}

/* ---------- 17. lesson ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.lesson-top .icon-btn{--ib-bg:transparent;--ib-fg:var(--muted);--ib-shade:transparent;border-color:transparent}
.track{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
#bar-fill{display:block;height:100%;width:0;background:var(--primary);border-radius:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.1)}
.track{position:relative}
#bar-shine{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);opacity:0;pointer-events:none}
.quit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px 14px;margin:-12px 0 20px}
.quit span{flex:1 1 100%;font-weight:800}
.quit .btn{flex:1 1 0;margin-bottom:var(--press)}
.quit .btn.text{--btn-fg:var(--bad);border:var(--bw) solid var(--line);box-shadow:0 var(--press) 0 var(--line);margin-bottom:var(--press)}
.ex{display:flex;flex-direction:column;gap:18px}
.ex-label{margin:0;font-size:22px;font-weight:900;letter-spacing:0;text-transform:none;color:var(--ink)}
.ex-label.new{color:var(--c-think)}
.big-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-size:clamp(28px,7.4vw,38px);font-weight:900;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.big.long{font-size:clamp(22px,5.8vw,28px)}
.audio{display:flex;gap:10px;align-items:center}
.listen{display:flex;justify-content:center;padding:18px 0}
.listen .icon-btn.big{width:88px;height:88px;border-radius:24px} .listen .icon-btn.big svg{width:42px;height:42px}
.listen .icon-btn:not(.big){width:56px;height:56px;border-radius:18px}
.hint{margin:-8px 0 0;color:var(--muted);font-weight:600}
.intro-en{font-size:22px;margin:0}
.options{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;font-size:17px;font-weight:800}
.opt .k{width:28px;height:28px;border-radius:8px;border:var(--bw) solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"] .k{border-color:currentColor;color:currentColor}
.line{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;
  background:repeating-linear-gradient(to bottom, transparent 0 57px, var(--line) 57px 59px)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:8px}
.tile{padding:9px 15px;border-radius:var(--r);font-weight:800}
.tile.gone{--qc-bg:var(--line);--qc-border:var(--line);--qc-shade:var(--line);color:transparent;box-shadow:none;transform:none}
.answer{width:100%;font-size:20px;font-weight:800;padding:14px 16px;border-radius:var(--r);border:var(--bw) solid var(--line);background:var(--sunk)}
.answer:focus{outline:none;border-color:var(--secondary);background:var(--surface)}
.answer.right{border-color:var(--good);background:var(--good-bg)}
.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.key{min-width:42px;height:42px;border-radius:12px;font-size:18px;font-weight:800;--press:3px}
.conj{display:grid;gap:4px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:16px 18px;border-left:8px solid var(--c-think)}
.conj-verb{font-size:34px;font-weight:900;line-height:1.1;color:var(--c-think)}
.conj-meta{color:var(--muted)}
.conj-person{font-size:22px;font-weight:900}
.fill-line{font-size:clamp(22px,5.8vw,28px);font-weight:800;line-height:1.7;margin:0}
.blank{display:inline-block;min-width:4ch;border-bottom:4px solid var(--secondary);padding:0 6px;color:var(--secondary)}
.blank.right{border-color:var(--good);color:var(--good)} .blank.wrong{border-color:var(--bad);color:var(--bad)}
.hint.en{font-style:normal}
.chips .chip{letter-spacing:0;text-transform:none;font-size:16px;font-weight:800}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:12px;align-content:start;min-width:0}
.pair{padding:12px;min-height:54px;font-weight:800;overflow-wrap:anywhere}
.pair.done{opacity:.4;box-shadow:none;transform:none;--qc-border:var(--line)}
.shake{animation:shake .35s;--qc-border:var(--bad) !important;--qc-shade:var(--bad) !important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;text-align:left;display:flex;flex-direction:column;border:var(--bw) solid var(--line);border-radius:18px;padding:10px 14px;background:var(--surface);font-weight:700}
.bubble.l{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.r{align-self:flex-end;border-bottom-right-radius:4px;background:var(--secondary-soft);border-color:var(--secondary)}
.bubble .who{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bubble .tr{display:none;color:var(--muted);font-size:15px}
.bubble.shown .tr{display:block}
.reply-cue{margin:4px 0 -8px;font-weight:900}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--r);padding:16px 24px;background:var(--secondary);color:var(--on-secondary);font-weight:900;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 var(--press) 0 var(--secondary-shade)}
.mic:active{transform:translateY(var(--press));box-shadow:none}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--bad);box-shadow:0 var(--press) 0 var(--bad-shade);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.heard{margin:0;min-height:1.5em;color:var(--muted)}
.w{border-bottom:2px dashed var(--line-strong);cursor:help;border-radius:2px}
.w:hover,.w.on{color:var(--secondary);border-bottom-color:var(--secondary);background:var(--secondary-soft)}
.cue{margin:-6px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.wtip{position:fixed;z-index:40;max-width:260px;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line);font-weight:800;font-size:15px;line-height:1.35;padding:8px 12px;border-radius:12px;pointer-events:none;box-shadow:0 4px 0 var(--line)}

/* ---------- 17b. motion pieces ---------- */
.mascot{position:fixed;left:max(10px, env(safe-area-inset-left, 0px));bottom:90px;z-index:4;width:112px;height:150px;pointer-events:none;overflow:hidden}
.m-body{position:absolute;left:0;bottom:-18px;width:112px;height:112px;transform:translateY(110%)}
.m-body svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.m-arm{transform-box:fill-box;transform-origin:0% 100%}
.m-bubble{position:absolute;left:92px;top:40px;white-space:nowrap;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line);border-radius:14px;padding:5px 10px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--line);opacity:0;transform-origin:0% 100%}
.mascot{overflow:visible}
.check-badge{position:absolute;right:12px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--good);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 3px 0 var(--good-shade)}
.check-badge svg{width:18px;height:18px}
.opt{position:relative}
.glow-ring{position:absolute;inset:-5px;border-radius:calc(var(--r) + 5px);box-shadow:0 0 0 3px var(--good),0 0 26px 6px color-mix(in srgb, var(--good) 55%, transparent);pointer-events:none;opacity:0}
.verdict{display:flex;align-items:center;gap:10px}
.v-icon{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:currentColor}
.v-icon svg{width:20px;height:20px;color:var(--surface)}
.checkbar.good .v-icon{background:var(--good)} .checkbar.bad .v-icon{background:var(--bad)} .checkbar.hot .v-icon{background:var(--gold-shade)}

/* ---------- 18. check bar ---------- */
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:var(--bw) solid var(--line);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.checkbar-in{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
#bar-msg{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--muted)}
#bar-msg:empty{display:none}
#bar-btn{flex:1 1 160px}
.checkbar.good{background:var(--good-bg);border-color:transparent}
.checkbar.good #bar-msg{color:var(--good)}
.checkbar.good #bar-btn{--btn-bg:var(--good);--btn-shade:var(--good-shade);--btn-fg:var(--on-good)}
.checkbar.bad{background:var(--bad-bg);border-color:transparent}
.checkbar.bad #bar-msg{color:var(--bad)}
.checkbar.bad #bar-btn{--btn-bg:var(--bad);--btn-shade:var(--bad-shade);--btn-fg:#FFFFFF}
.verdict{font-size:24px;font-weight:900}
.mean{color:var(--ink);font-weight:700}
.checkbar.hot{background:var(--sun-100);border-color:transparent}
:root[data-theme="dark"] .checkbar.hot{background:#3A2E08}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .checkbar.hot{background:#3A2E08} }
.checkbar.hot #bar-msg{color:var(--gold-shade)}
.checkbar.hot #bar-btn{--btn-bg:var(--gold);--btn-shade:var(--gold-shade);--btn-fg:#3A2A00}
.combo{display:block;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}

/* ---------- 19. finish / celebration ---------- */
.done-card{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.done-card h2{font-size:clamp(28px,7.6vw,38px);font-weight:900;line-height:1.15}
.done-note{margin:0;color:var(--muted);font-weight:600}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;width:100%}
.done-stats div{background:var(--surface);border:var(--bw) solid var(--cc, var(--line));border-radius:var(--r);padding:0 0 12px;overflow:hidden;text-align:center}
.done-stats dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#FFFFFF;background:var(--cc, var(--line));font-weight:900;padding:5px 4px}
.done-stats dd{margin:8px 0 0;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cc, var(--ink))}
.ds.xp{--cc:var(--gold)} .ds.acc{--cc:var(--primary)} .ds.time{--cc:var(--secondary)}
.ds-w{display:block;font-size:12.5px;font-weight:900;color:var(--cc)}
.done-card .levels{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.missed h3,.sheet-body h3{font-size:20px;font-weight:900;margin:6px 0 8px}
.missed ul,.vocab{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.missed li,.vocab li{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:var(--bw) solid var(--line)}
.m-es{font-weight:900} .m-en{color:var(--muted);font-weight:600}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.pop{animation:popin .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes popin{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.done-card.center{align-items:center;text-align:center}
.medal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);border:4px solid var(--primary);box-shadow:0 6px 0 var(--primary-shade)}
.medal svg{width:52px;height:52px}
.small-medal{width:76px;height:76px} .small-medal svg{width:38px;height:38px}
.done-card.perfect .medal{background:var(--gold);color:#3A2A00;border-color:var(--gold-shade);box-shadow:0 6px 0 var(--gold-shade),0 0 40px var(--glow);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{box-shadow:0 6px 0 var(--gold-shade),0 0 70px var(--glow)}}
.done-card.perfect h2{color:var(--gold-shade);font-size:clamp(40px,11vw,54px)}
.done-card.perfect .eyebrow{color:var(--gold-shade)}
.flame-big{background:none;border:0;box-shadow:none;color:var(--streak);width:110px;height:110px}
.flame-big svg{width:100px;height:100px}
.big-count{margin:-6px 0 0;font-size:76px;font-weight:900;line-height:1;color:var(--streak);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.wk{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);color:var(--muted);font-size:13px;font-weight:900}
.wk.on{background:var(--streak);border-color:var(--streak);color:#FFFFFF}
.wk.today{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--streak)}
.wk.future{opacity:.5;border-style:dashed}
.lv-medal{flex-direction:column;gap:0;align-content:center;font-weight:900;--primary:var(--secondary);--primary-soft:var(--secondary-soft);--primary-shade:var(--secondary-shade)}
.lv-medal span{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.lv-medal b{font-size:44px;line-height:1}
.dots{display:flex;justify-content:center;gap:6px;margin:20px 0 14px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--primary);width:22px;border-radius:4px}

/* ---------- 20. sheet, forms, misc ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;justify-content:center;align-items:flex-end}
.sheet-panel{background:var(--bg);width:100%;max-width:660px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;border:var(--bw) solid var(--line);border-bottom:0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet-head h2{font-size:26px;font-weight:900}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--sunk);border:var(--bw) solid var(--line);border-radius:var(--r);padding:4px 18px;max-width:65ch;color:var(--muted);font-weight:600}
.vt-wrap{overflow-x:auto}
.vt{border-collapse:separate;border-spacing:0;min-width:280px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden}
.vt caption{text-align:left;font-weight:900;padding:0 0 6px}
.vt th,.vt td{padding:8px 14px;border-bottom:var(--bw) solid var(--line);text-align:left}
.vt tr:last-child th,.vt tr:last-child td{border-bottom:0}
.vt th{color:var(--muted);font-weight:700}
.vt td{font-weight:900;color:var(--c-think)}
.field{display:grid;gap:8px;justify-items:start;width:100%}
.field>label{font-weight:900}
.field select{max-width:100%}
.range{display:flex;align-items:center;gap:12px;width:100%}
.range input{flex:1;accent-color:var(--primary)}
.switch{display:flex;gap:12px;align-items:flex-start;font-weight:900}
.switch input{width:22px;height:22px;accent-color:var(--primary);margin-top:2px;flex:none}
.switch small{display:block;font-weight:600;color:var(--muted)}
textarea{width:100%;border-radius:var(--r-sm);border:var(--bw) solid var(--line);background:var(--sunk);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:400;resize:vertical}
.status{margin:0;font-weight:900;color:var(--primary-ink);min-height:1.5em}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-bg);border-radius:var(--r);padding:12px}
.confirm span{flex:1 1 200px;color:var(--bad);font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:var(--r);font-weight:900;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
/* ---------- 21. illustrations on blobs ---------- */
/* layered organic blobs: a darker "back" blob offset for depth, a soft "front" blob, and a highlight */
.blob-art{--hue:var(--cc, var(--secondary));position:relative;display:grid;place-items:center;flex:none;isolation:isolate;
  width:var(--s);height:var(--s);color:color-mix(in srgb, var(--hue) 78%, var(--ink))}
.blob-art.sm{--s:52px} .blob-art.md{--s:96px} .blob-art.lg{--s:148px}
.blob{position:absolute;inset:0;z-index:-1}
.blob.back{background:color-mix(in srgb, var(--hue) 42%, var(--surface));transform:translate(5%, 7%) rotate(-8deg)}
.blob.front{background:color-mix(in srgb, var(--hue) 20%, var(--surface));box-shadow:inset 0 -6px 0 color-mix(in srgb, var(--hue) 14%, transparent)}
.blob.shine{inset:14% 52% 58% 16%;background:rgba(255,255,255,.55);border-radius:50%;filter:blur(1px)}
:root[data-theme="dark"] .blob.shine{background:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .blob.shine{background:rgba(255,255,255,.12)} }
.b1 .blob.front,.b1 .blob.back{border-radius:58% 42% 55% 45% / 48% 58% 42% 52%}
.b2 .blob.front,.b2 .blob.back{border-radius:42% 58% 38% 62% / 55% 45% 55% 45%}
.b3 .blob.front,.b3 .blob.back{border-radius:63% 37% 54% 46% / 38% 52% 48% 62%}
.b4 .blob.front,.b4 .blob.back{border-radius:50% 50% 36% 64% / 60% 40% 60% 40%}
.art{width:58%;height:58%;display:grid;place-items:center;position:relative}
.art svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 0 color-mix(in srgb, var(--hue) 30%, transparent))}
.art .fl{fill:currentColor;stroke:none;opacity:.2}
.art-num{font-size:calc(var(--s) * .36);font-weight:900;line-height:1;letter-spacing:-.02em;text-shadow:0 3px 0 color-mix(in srgb, var(--hue) 30%, transparent)}
.art-day b{position:absolute;inset:34% 0 0;display:grid;place-items:center;font-size:calc(var(--s) * .2);font-weight:900}
.art-txt{fill:currentColor;font-family:var(--font);font-weight:900}
.art-photo{width:78%;height:78%;object-fit:cover;border-radius:38% 62% 46% 54% / 52% 44% 56% 48%;box-shadow:0 4px 0 color-mix(in srgb, var(--hue) 40%, transparent)}

/* ---------- 22. picture questions: responsive grid, image slot on top, text slot below ---------- */
.pic-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px}
@media (min-width:600px){ .pic-grid{grid-template-columns:repeat(4, minmax(0,1fr))} }
.opt.pic{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;text-align:center}
.pic-top{display:grid;place-items:center;padding:16px 10px 10px;aspect-ratio:1 / .86;background:var(--qc-bg)}
.pic-top .blob-art{--s:min(100%, 118px)}
.pic-bottom{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 10px 12px;font-size:17px;font-weight:900;border-top:var(--bw) solid var(--qc-border)}
.opt.pic .k{position:absolute;left:8px;top:8px;background:var(--surface)}
.opt.pic .check-badge{top:8px;right:8px;margin-top:0}
.opt.pic[aria-pressed="true"] .pic-top,.opt.pic.right .pic-top,.opt.pic.wrong .pic-top{background:transparent}
.intro-art{display:flex;justify-content:center;padding:8px 0}

/* ---------- 23. Sol, the mascot ---------- */
.sol{--sol-core:#FFC21A;--sol-shade:#F29E0C;--sol-ray:#FF9F3D;--sol-foot:#F28A0C;--sol-ink:#2B2B33;--sol-cheek:#FF8CC4;
  width:100%;height:100%;display:block;overflow:visible}
.sol *{transform-box:fill-box}
.sol-shadow{fill:rgba(0,0,0,.12);transform-origin:center}
.sol-foot{fill:var(--sol-foot);transform-origin:50% 0%}
.sol-body{transform-origin:50% 100%}
.sol-rays{transform-origin:center}
.sol-ray{fill:var(--sol-ray);transform-box:view-box;transform-origin:0 0}
.sol-arm rect{fill:var(--sol-shade)}
.sol-arm.l{transform-origin:100% 50%} .sol-arm.r{transform-origin:0% 50%}
.sol-core{fill:var(--sol-core)}
.sol-core-shade{fill:none;stroke:var(--sol-shade);stroke-width:5}
.sol-cheeks{fill:var(--sol-cheek);opacity:.75}
.sol-eye{transform-origin:center}
.sol-white{fill:#FFFFFF}
.sol-pupil{fill:var(--sol-ink)}
.sol-glint{fill:#FFFFFF}
.sol-mouth{fill:#7A2E00;transform-origin:50% 0%}
/* moods (add one class to the <svg>) */
.sol.is-idle .sol-body{animation:sol-bob 2.6s ease-in-out infinite}
.sol.is-idle .sol-rays{animation:sol-spin 18s linear infinite}
.sol.is-idle .sol-shadow{animation:sol-shadow 2.6s ease-in-out infinite}
.sol .sol-eye{animation:sol-blink 4.2s infinite}
.sol.is-bounce .sol-body{animation:sol-jump .7s cubic-bezier(.3,1.5,.5,1)}
.sol.is-bounce .sol-shadow{animation:sol-shadow-jump .7s ease}
.sol.is-wiggle .sol-body{animation:sol-wiggle .6s ease}
.sol.is-cheer .sol-arm.l{animation:sol-arm-l .45s ease-in-out 2}
.sol.is-cheer .sol-arm.r{animation:sol-arm-r .45s ease-in-out 2}
.sol.is-cheer .sol-body{animation:sol-jump .7s cubic-bezier(.3,1.5,.5,1)}
.sol.is-cheer .sol-mouth{animation:sol-grin .9s ease}
.sol.is-spin .sol-rays{animation:sol-spin .8s cubic-bezier(.3,.7,.3,1)}
@keyframes sol-bob{50%{transform:translateY(-4px) scaleY(1.02)}}
@keyframes sol-shadow{50%{transform:scaleX(.88);opacity:.7}}
@keyframes sol-spin{to{transform:rotate(360deg)}}
@keyframes sol-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sol-jump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}55%{transform:translateY(-22px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes sol-shadow-jump{55%{transform:scaleX(.6);opacity:.4}}
@keyframes sol-wiggle{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}100%{transform:none}}
@keyframes sol-arm-l{50%{transform:rotate(38deg)}}
@keyframes sol-arm-r{50%{transform:rotate(-38deg)}}
@keyframes sol-grin{40%{transform:scaleY(1.35)}}
.sol-wrap{display:block;width:100%;height:100%}

/* Sol on the dashboard */
.hero-top{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%}
.hero-sol{width:96px;height:112px;flex:none;background:none;border:0;padding:0;cursor:pointer}
.hero-bubble{position:relative;align-self:center;margin-bottom:34px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:16px;padding:8px 14px;font-weight:900;box-shadow:0 4px 0 var(--line);text-align:left;max-width:220px}
.hero-bubble small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.hero-bubble::after{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--surface);border-left:var(--bw) solid var(--line);border-bottom:var(--bw) solid var(--line);transform:rotate(45deg)}
/* unit illustrations */
.unit-pic{position:relative;width:56px;height:56px;display:grid;place-items:center}
.unit-pic .blob-art{--s:56px}
.unit-pic .unit-n{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;font-size:12px;box-shadow:0 2px 0 var(--line-strong);border:var(--bw) solid var(--surface)}
.unit.locked .unit-pic{filter:grayscale(1);opacity:.6}
.unit{grid-template-columns:56px minmax(0,1fr) auto}
@media (max-width:520px){ .unit{grid-template-columns:56px minmax(0,1fr)} }
/* the pop-up mascot during lessons uses the same Sol */
.m-body .sol{width:100%;height:100%}
.done-sol{width:110px;height:128px}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

      <div class="track" aria-hidden="true"><span id="bar-fill"></span><span id="bar-shine"></span></div>
    </div>

</div>

</div>
<script>
/* Ruta Spanish — course content.
   Format for words and sentences:  "Spanish|alt Spanish = English|alt English ~ optional hint"
   Dialogue lines:                  "Speaker: Spanish = English"
   Add new units to the end of COURSE and they appear on the path automatically. */

const VERBS = {
  'ser|pres':    ['soy','eres','es','somos','sois','son'],
  'estar|pres':  ['estoy','estás','está','estamos','estáis','están'],
  'tener|pres':  ['tengo','tienes','tiene','tenemos','tenéis','tienen'],
  'ir|pres':     ['voy','vas','va','vamos','vais','van'],
  'hablar|pres': ['hablo','hablas','habla','hablamos','habláis','hablan'],
  'comer|pres':  ['como','comes','come','comemos','coméis','comen'],
  'vivir|pres':  ['vivo','vives','vive','vivimos','vivís','viven'],
  'querer|pres': ['quiero','quieres','quiere','queremos','queréis','quieren'],
  'poder|pres':  ['puedo','puedes','puede','podemos','podéis','pueden'],
  'hacer|pres':  ['hago','haces','hace','hacemos','hacéis','hacen'],
  'hablar|pret': ['hablé','hablaste','habló','hablamos','hablasteis','hablaron'],
  'comer|pret':  ['comí','comiste','comió','comimos','comisteis','comieron'],
  'ir|pret':     ['fui','fuiste','fue','fuimos','fuisteis','fueron'],
  'hacer|pret':  ['hice','hiciste','hizo','hicimos','hicisteis','hicieron'],
  'tener|pret':  ['tuve','tuviste','tuvo','tuvimos','tuvisteis','tuvieron']
};
const VERB_EN = { ser:'to be', estar:'to be', tener:'to have', ir:'to go', hablar:'to speak', comer:'to eat',
  vivir:'to live', querer:'to want', poder:'to be able to', hacer:'to do, to make' };

const COURSE = [
{ id:'saludos', es:'Saludos', en:'Greetings', band:'A1',
  tip:`<p>Spanish questions open with <b>¿</b> and exclamations with <b>¡</b>: <i>¿Qué tal?</i> <i>¡Hola!</i></p>
<p>Vowels always sound the same: <b>a</b> as in father, <b>e</b> as in met, <b>i</b> as in machine, <b>o</b> as in more (short), <b>u</b> as in rule. <b>h</b> is silent, <b>ñ</b> sounds like "ny", <b>ll</b> and <b>y</b> like "y", and <b>j</b> like a throaty "h".</p>
<p>Accent marks matter: <i>sí</i> means yes, <i>si</i> means if. Ruta forgives a missing accent but points it out.</p>
<p><b>Tú</b> is informal "you" (friends, family). <b>Usted</b> is formal (strangers, older people, service staff).</p>`,
  words:['hola = hello|hi','adiós = goodbye|bye','buenos días = good morning','buenas tardes = good afternoon',
    'buenas noches = good night|good evening','gracias = thank you|thanks','por favor = please','sí = yes','no = no',
    'perdón = sorry|excuse me','de nada = you\'re welcome','¿qué tal? = how\'s it going?|how are you?'],
  sents:['Hola, ¿qué tal? = Hello, how are you?|Hi, how are you?|Hi, how\'s it going?|Hello, how\'s it going?',
    'Muy bien, gracias. = Very well, thank you.|Very well, thanks.|Very good, thanks.|Very good, thank you.',
    'Buenos días, señora. = Good morning, ma\'am.|Good morning, madam.',
    'Me llamo Ana. = My name is Ana.|I\'m called Ana.|I am called Ana.',
    '¿Cómo te llamas? = What\'s your name?|What is your name?',
    'Mucho gusto. = Nice to meet you.|Pleased to meet you.',
    'Hasta luego. = See you later.'],
  dlg:['Marco: ¡Hola! ¿Qué tal? = Hi! How\'s it going?',
    'Lucía: Muy bien, gracias. ¿Y tú? = Very well, thanks. And you?',
    'Marco: Bien. ¿Cómo te llamas? = Good. What\'s your name?',
    'Lucía: Me llamo Lucía. ¿Y tú? = My name is Lucía. And you?',
    'Marco: Soy Marco. Mucho gusto. = I\'m Marco. Nice to meet you.',
    'Lucía: Encantada. = Delighted to meet you.'] },

{ id:'personas', es:'Personas', en:'People and "ser"', band:'A1', verbs:['ser|pres'],
  tip:`<p>Every noun is masculine or feminine. "The" is <b>el</b> (masculine) or <b>la</b> (feminine); "a" is <b>un</b> or <b>una</b>.</p>
<p><b>Ser</b> means "to be" for identity, origin and what someone is like: <i>Soy de Australia</i>, <i>Es simpático</i>.</p>
<p>Spanish usually drops the pronoun because the verb ending already says who: <i>Soy Carlos</i> = I'm Carlos. Ruta accepts both.</p>`,
  words:['yo = I','tú = you ~ informal','él = he','ella = she','nosotros = we','ellos = they',
    'el hombre = the man|man','la mujer = the woman|woman','el niño = the boy|boy|the child','la niña = the girl|girl',
    'el amigo = the friend|friend','soy = I am|I\'m ~ ser','eres = you are|you\'re ~ ser','somos = we are|we\'re ~ ser'],
  sents:['Yo soy Carlos. = I am Carlos.|I\'m Carlos.','Ella es mi amiga. = She is my friend.|She\'s my friend.',
    'Tú eres muy simpático. = You are very nice.|You\'re very nice.','Somos amigos. = We are friends.|We\'re friends.',
    'Él es un hombre. = He is a man.|He\'s a man.','Ellos son de México. = They are from Mexico.|They\'re from Mexico.',
    '¿De dónde eres? = Where are you from?','Soy de Australia. = I am from Australia.|I\'m from Australia.'] },

{ id:'numeros', es:'Números', en:'Numbers', band:'A1',
  tip:`<p><b>Hay</b> means both "there is" and "there are": <i>Hay tres gatos</i>.</p>
<p>Age uses <b>tener</b> (to have): <i>Tengo veinte años</i>, literally "I have twenty years".</p>
<p>16 to 29 are written as one word: dieciséis, diecisiete, veintiuno, veintidós…</p>
<p>Time: <i>Es la una</i> (one o'clock) but <i>Son las dos, son las diez</i>.</p>`,
  words:['uno = one|1','dos = two|2','tres = three|3','cuatro = four|4','cinco = five|5','seis = six|6','siete = seven|7',
    'ocho = eight|8','nueve = nine|9','diez = ten|10','once = eleven|11','doce = twelve|12','veinte = twenty|20','cien = a hundred|one hundred|100'],
  sents:['Tengo dos hermanos. = I have two brothers.|I have two siblings.','Hay tres gatos. = There are three cats.',
    '¿Cuántos años tienes? = How old are you?','Tengo veinte años. = I am twenty years old.|I\'m twenty years old.|I am twenty.|I\'m twenty.',
    'Son las diez. = It is ten o\'clock.|It\'s ten o\'clock.|It is ten.|It\'s ten.','El número es cinco. = The number is five.'] },

{ id:'comida', es:'Comida', en:'Food and drink', band:'A1',
  tip:`<p>The present tense covers both "I eat" and "I am eating": <i>como</i>.</p>
<p>To make a sentence negative, put <b>no</b> before the verb: <i>No como carne</i>.</p>
<p><i>El agua</i> is feminine (<i>el agua fría</i>) but takes <b>el</b> because it starts with a stressed "a".</p>`,
  words:['el agua = water|the water','el pan = bread|the bread','la leche = milk|the milk','el café = coffee|the coffee',
    'la manzana = apple|the apple|an apple','el queso = cheese|the cheese','la carne = meat|the meat','el pescado = fish|the fish ~ as food',
    'el arroz = rice|the rice','la cerveza = beer|the beer','como = I eat ~ comer','bebo = I drink ~ beber'],
  sents:['Yo como pan. = I eat bread.|I am eating bread.|I\'m eating bread.','Bebo agua. = I drink water.|I am drinking water.|I\'m drinking water.',
    'Ella come una manzana. = She eats an apple.|She is eating an apple.|She\'s eating an apple.',
    'Quiero un café, por favor. = I want a coffee, please.|I\'d like a coffee, please.',
    'No como carne. = I don\'t eat meat.|I do not eat meat.','El queso es bueno. = The cheese is good.'] },

{ id:'familia', es:'Familia', en:'Family', band:'A1',
  tip:`<p>Possessives: <b>mi / mis</b> (my), <b>tu / tus</b> (your), <b>su / sus</b> (his, her, their, or formal your). Add -s with plural nouns: <i>mis padres</i>.</p>
<p>A masculine plural covers mixed groups: <i>los padres</i> = parents, <i>los hermanos</i> = brothers and sisters.</p>
<p>No article before a job after <i>ser</i>: <i>Es profesora</i> = She's a teacher.</p>`,
  words:['la madre = mother|the mother|mum|mom','el padre = father|the father|dad','el hermano = brother|the brother',
    'la hermana = sister|the sister','el hijo = son|the son','la hija = daughter|the daughter','los padres = parents|the parents',
    'el abuelo = grandfather|grandpa|the grandfather','la abuela = grandmother|grandma|the grandmother','mi = my',
    'tu = your ~ informal','su = his|her|their ~ also formal "your"'],
  sents:['Mi madre es profesora. = My mother is a teacher.|My mum is a teacher.|My mom is a teacher.',
    'Tu hermano es alto. = Your brother is tall.','Tengo una hermana. = I have a sister.|I have one sister.',
    'Mis padres viven en Madrid. = My parents live in Madrid.',
    'Su hija se llama Lucía. = Her daughter is called Lucía.|His daughter is called Lucía.|Her daughter\'s name is Lucía.|His daughter\'s name is Lucía.',
    'Mi abuela es muy simpática. = My grandmother is very nice.|My grandma is very nice.'] },

{ id:'verbos-ar', es:'Verbos en -ar', en:'Regular -ar verbs', band:'A1', verbs:['hablar|pres'],
  tip:`<p>Most Spanish verbs end in <b>-ar</b>. Drop the -ar and add: <b>-o, -as, -a, -amos, -áis, -an</b>.</p>
<p><i>hablar → hablo, hablas, habla, hablamos, habláis, hablan</i></p>
<p><b>Vosotros</b> (you all, informal) is used in Spain. Latin America uses <b>ustedes</b> with the -an form for every "you all".</p>`,
  words:['hablar = to speak|to talk','trabajar = to work','estudiar = to study','escuchar = to listen|to listen to',
    'cocinar = to cook','caminar = to walk','hablo = I speak|I talk','hablas = you speak|you talk',
    'habla = he speaks|she speaks|he talks|she talks','hablamos = we speak|we talk','hablan = they speak|they talk'],
  sents:['Hablo un poco de español. = I speak a little Spanish.','¿Hablas inglés? = Do you speak English?',
    'Trabajamos los lunes. = We work on Mondays.','Ella estudia mucho. = She studies a lot.',
    'Ellos escuchan música. = They listen to music.|They are listening to music.|They\'re listening to music.',
    'Mi padre cocina muy bien. = My father cooks very well.|My dad cooks very well.'] },

{ id:'lugares', es:'Lugares', en:'Places, "estar" and "ir"', band:'A1', verbs:['estar|pres','ir|pres'],
  tip:`<p>Two verbs mean "to be". <b>Estar</b> is for location and temporary states: <i>Estoy en casa</i>, <i>Estoy cansado</i>. <b>Ser</b> is for identity and lasting traits.</p>
<p><b>a + el = al</b>: <i>Vamos al centro</i>. Likewise <b>de + el = del</b>.</p>
<p><b>Ir</b> (to go) is irregular: voy, vas, va, vamos, vais, van.</p>`,

  sents:['¿Dónde está el baño? = Where is the bathroom?|Where\'s the bathroom?|Where is the toilet?|Where\'s the toilet?',
    'Estoy en casa. = I am at home.|I\'m at home.','El banco está aquí. = The bank is here.',
    'Voy a la playa. = I am going to the beach.|I\'m going to the beach.|I go to the beach.',

{ id:'tiempo', es:'El tiempo', en:'Days and time', band:'A1',
  tip:`<p>Days and months are not capitalised. <i>El lunes</i> = on Monday; <i>los lunes</i> = on Mondays.</p>
<p>Telling time: <i>Es la una</i>, <i>Son las tres</i>. Add <b>y media</b> (half past), <b>y cuarto</b> (quarter past) or <b>menos cuarto</b> (quarter to).</p>
<p><i>Mañana</i> means both "tomorrow" and "morning": <i>mañana por la mañana</i> = tomorrow morning.</p>`,
  words:['el lunes = Monday|on Monday','el martes = Tuesday|on Tuesday','el miércoles = Wednesday|on Wednesday','el jueves = Thursday|on Thursday',
    'el viernes = Friday|on Friday','el sábado = Saturday|on Saturday','el domingo = Sunday|on Sunday','hoy = today',

  sents:['Hoy es lunes. = Today is Monday.','Mañana es sábado. = Tomorrow is Saturday.','¿Qué hora es? = What time is it?',
    'Es la una. = It is one o\'clock.|It\'s one o\'clock.|It is one.|It\'s one.',

    'Trabajo de lunes a viernes. = I work from Monday to Friday.|I work Monday to Friday.'] },

{ id:'tener-querer', es:'Tener, querer, poder', en:'Have, want, can', band:'A2', verbs:['tener|pres','querer|pres','poder|pres'],
  tip:`<p>Some verbs change their stem when it's stressed: <b>e → ie</b> (querer: quiero; tener: tienes) and <b>o → ue</b> (poder: puedo). The nosotros form keeps the original stem: <i>queremos, podemos</i>.</p>
<p><b>Tener que</b> + verb = to have to: <i>Tengo que trabajar</i>.</p>
<p>Spanish "has" hunger and thirst: <i>tengo hambre, tengo sed, tengo frío</i>.</p>`,

{ id:'describir', es:'Describir', en:'Describing things', band:'A2',
  tip:`<p>Adjectives usually come after the noun and match it in gender and number: <i>un coche viejo, una casa vieja, unas casas viejas</i>.</p>
<p>Adjectives ending in -e or a consonant only change for plural: <i>grande → grandes</i>, <i>feliz → felices</i>.</p>
<p><b>Ser</b> for what something is like, <b>estar</b> for how it is right now: <i>Es aburrido</i> (he's boring) vs <i>Está aburrido</i> (he's bored).</p>`,
  words:['grande = big|large','pequeño = small|little','bonito = pretty|beautiful|nice','feo = ugly','nuevo = new','viejo = old',

    'Estoy muy cansada. = I am very tired.|I\'m very tired.','Las manzanas son baratas. = The apples are cheap.|Apples are cheap.',
    'Es una ciudad bonita. = It is a pretty city.|It\'s a pretty city.|It is a beautiful city.|It\'s a beautiful city.',
    'Ellos están felices. = They are happy.|They\'re happy.'] },

{ id:'pasado', es:'El pasado', en:'The past tense', band:'B1', verbs:['hablar|pret','comer|pret','ir|pret','hacer|pret','tener|pret'],
  tip:`<p>The <b>preterite</b> is for finished actions at a point in the past: <i>Ayer comí paella</i>.</p>
<p>-ar: <b>-é, -aste, -ó, -amos, -asteis, -aron</b>. -er and -ir: <b>-í, -iste, -ió, -imos, -isteis, -ieron</b>.</p>
<p>The accent changes the meaning: <i>hablo</i> = I speak, <i>habló</i> = he spoke.</p>
<p><b>Ir</b> and <b>ser</b> share the same preterite: <i>fui</i> = I went or I was. Context tells you which.</p>`,

  sents:['Ayer comí paella. = Yesterday I ate paella.|I ate paella yesterday.',
    'Anoche vimos una película. = Last night we watched a film.|Last night we watched a movie.|We watched a movie last night.|We watched a film last night.|Last night we saw a movie.|Last night we saw a film.',

{ id:'gustos', es:'Gustos', en:'Likes with "gustar"', band:'B1',
  tip:`<p><b>Gustar</b> works backwards: <i>Me gusta el café</i> literally means "coffee pleases me".</p>
<p>Use <b>gusta</b> for one thing or an action, <b>gustan</b> for plural things: <i>Me gustan los libros</i>.</p>
<p>The pronouns are <b>me, te, le, nos, os, les</b>. Add <i>a mí, a ti, a mi hermana</i> for emphasis or clarity.</p>
<p>Agreeing: <i>A mí también</i> (me too) after a positive, <i>A mí tampoco</i> (me neither) after a negative.</p>`,

    'me encanta = I love','el fútbol = football|soccer','la música = music|the music','los libros = books|the books',
    'bailar = to dance','nadar = to swim','también = also|too','tampoco = neither|either|not either'],
  sents:['Me gusta el café. = I like coffee.','¿Te gusta bailar? = Do you like to dance?|Do you like dancing?',
    'Nos gustan los libros. = We like books.|We like the books.',

function canDo(type, flags){

/* ---------- session builders ---------- */
function buildLesson(ui, level, test){
  const u = COURSE[ui], pool = UNIT_ITEMS[u.id];
  const n = test ? 12 : [0,12,14,15][level];
  const beg = isBeginner(ui);
  const types = LEVEL_TYPES[beg ? 'A1' : 'rest'][test ? 3 : level].filter(t => t !== 'speak' || speakOK(ui));
  const older = ALL.filter(i => i.u < ui && S.srs[i.key]);
  const used = {}, seen = new Set(), out = [];
  const forced = (!test && level === 1) ? ['mc_es2en','mc_en2es','mc_es2en'] : [];
  let count = 0, guard = 0;
  while (count < n && guard++ < 400){
    const type = forced.length ? forced.shift() : pick(types);
    if (!canDo(type)) continue;
    const kinds = TYPES[type].k;
    const fits = i => kinds.includes(i.kind) && (type !== 'pic' || hasArt(i)) && (!beg || i.kind === 'w') && (beg || type !== 'speak' || i.kind === 's');
    let cands = pool.filter(fits);
    if (level >= 2 && !test && Math.random() < 0.2){ const rc = older.filter(fits); if (rc.length) cands = rc; }
    if (!cands.length) continue;
    const scored = cands.map(i => [i, (used[i.key]||0)*10 + (box(i.key) < 0 && !seen.has(i.key) ? -3 : Math.max(0,box(i.key))) + Math.random()*2.5]);
    scored.sort((a,b) => a[1]-b[1]);
    const item = scored[0][0];
    const ex = makeEx(type, item); if (!ex) continue;
    used[item.key] = (used[item.key]||0) + 1;
    if (!test) for (const it of ex.items) if (it.kind === 'w' && box(it.key) < 0 && !seen.has(it.key)) out.push({ t:'intro', item:it, items:[it] });
    ex.items.forEach(it => seen.add(it.key));
    out.push(ex); count++;
  }
  return out;
}
function exForItem(item){
  const b = box(item.key);
  let opts;
  if (item.kind === 'w') opts = ['mc_es2en','mc_en2es','listen_mc','match'].concat(hasArt(item) ? ['pic','pic'] : [], b > 2 && speakOK(item.u) ? ['speak'] : []);
  else if (item.kind === 's') opts = b <= 2 ? ['tiles_es2en','tiles_en2es','fill','mc_es2en'] : ['tiles_en2es','listen_mc','fill'].concat(speakOK(item.u) ? ['speak'] : []);
  else if (item.kind === 'v') opts = ['conj'];
  else opts = ['dlg'];
  opts = opts.filter(t => canDo(t));
  return makeEx(pick(opts), item);
}
function buildFromItems(items, n){
  return shuffle(items).slice(0, n).map(exForItem).filter(Boolean);
}
function buildReview(){
  const due = dueItems().sort((a,b) => S.srs[a.key].b - S.srs[b.key].b || S.srs[a.key].d - S.srs[b.key].d).slice(0, 15);
  return buildFromItems(due, 15);
}
function buildMistakes(){
  const w = weakItems().sort((a,b) => (S.srs[b.key].w - S.srs[b.key].r) - (S.srs[a.key].w - S.srs[a.key].r)).slice(0, 12);
  return buildFromItems(w, 12);
}
function buildVerbs(){
  const v = ALL.filter(i => i.kind === 'v' && unlocked(i.u));
  return shuffle(v).sort((a,b) => box(a.key) - box(b.key)).slice(0, 15).map(i => makeEx('conj', i));
}

/* ---------- speech ---------- */
const TTS = typeof window !== 'undefined' && 'speechSynthesis' in window;
const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
let VOICE = null, micBlocked = false;
const MALE = /\b(alvaro|álvaro|jorge|pablo|ra[uú]l|dar[ií]o|gonzalo|tom[aá]s|jos[eé]|arnau|gerardo|liberto|cecilio|andr[eé]s|juan|diego|carlos|enrique|luciano|mateo|alonso|sa[uú]l|teo|rodrigo|emilio|nicol[aá]s|lorenzo|alex|federico|mauricio|sergio|male|hombre)\b/i;
const FEMALE = /\b(helena|laura|elvira|paloma|sabina|dalia|m[oó]nica|paulina|elena|luc[ií]a|conchita|pen[eé]lope|lupe|ximena|abril|irene|estrella|larissa|marisol|l[ií]a|ver[oó]nica|camila|valentina|catalina|beatriz|carlota|female|mujer)\b|google espa/i;
const isMale = v => MALE.test(v.name) && !FEMALE.test(v.name);
const vid = v => v.voiceURI || v.name;
function vQuality(v){ const t = (v.voiceURI || '') + ' ' + v.name;
  if (/premium/i.test(t)) return 3; if (/enhanced|mejorad|superior|natural|neural|online/i.test(t)) return 2; return 0; }
const NOVELTY = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|abuel[oa])\b/i;
const REGION = { ES:'Spain', MX:'Mexico', US:'US', AR:'Argentina', CO:'Colombia', CL:'Chile', '419':'Latin America' };
function vLabel(v){
  const nm = v.name.replace(/^Microsoft /,'').replace(/ - Spanish.*$/,'').replace(/\s*\((enhanced|premium|mejorad[ao]|superior)\)/i,'').replace(/ Online \(Natural\)/,'');
  const rg = REGION[(v.lang.split(/[-_]/)[1] || '').toUpperCase()] || v.lang;
  const q = vQuality(v);
  return nm + ' · ' + rg + (q === 3 ? ' · Premium' : q === 2 ? (/natural|neural|online/i.test(v.name) ? ' · Natural' : ' · Enhanced') : '') + (isMale(v) ? ' · male' : '');
}
function esVoices(){
  if (!TTS) return [];
  const best = {};
  speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang) && !NOVELTY.test(v.name)).forEach(v => {
    const k = v.name.replace(/\s*\(.*\)/,'').replace(/ Online.*$/,'').toLowerCase() + '|' + v.lang.toLowerCase();
    if (!best[k] || vQuality(v) > vQuality(best[k])) best[k] = v;
  });

}
function voiceScore(v){
  let s = 0;
  if (isMale(v)) s += 10; else if (FEMALE.test(v.name)) s -= 2;
  s += vQuality(v) * 4;
  if (/^es[-_]ES/i.test(v.lang)) s += 2; else if (/^es[-_](MX|US|419)/i.test(v.lang)) s += 1;
  return s;
}
function pickVoice(){
  if (!TTS) return; const vs = speechSynthesis.getVoices();
  const es = vs.filter(v => /^es/i.test(v.lang));
  const want = S.settings.voice;
  const chosen = want && (es.find(v => vid(v) === want) || es.filter(v => v.name === want).sort((a,b) => vQuality(b) - vQuality(a))[0]);
  VOICE = chosen || esVoices()[0] || null;
}
function say(text, slow){
  if (!TTS) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE ? VOICE.lang : 'es-ES'; if (VOICE) u.voice = VOICE; u.rate = S.settings.rate * (slow ? 0.65 : 1); u.pitch = 1; u.volume = 1;
    speechSynthesis.speak(u); } catch(e){}
}
let actx = null;
function sfx(ok){
  if (!S.settings.sfx) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 990] : [220, 180];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = ok ? 'sine' : 'triangle';
      o.frequency.value = f; const t = actx.currentTime + i*0.09; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2); });
  } catch(e){}
}

const NUM_ART = { uno:'1', dos:'2', tres:'3', cuatro:'4', cinco:'5', seis:'6', siete:'7', ocho:'8', nueve:'9', diez:'10', once:'11', doce:'12', veinte:'20', cien:'100' };
const DAY_ART = { 'el lunes':'L', 'el martes':'M', 'el miércoles':'X', 'el jueves':'J', 'el viernes':'V', 'el sábado':'S', 'el domingo':'D' };
const UNIT_ART = { saludos:'wave', personas:'man', numeros:'#', comida:'apple', familia:'family', 'verbos-ar':'speech', lugares:'pin', tiempo:'clock',
  'verbos-er-ir':'books', 'tener-querer':'gift', describir:'palette', restaurante:'cutlery', futuro:'rocket', pasado:'clockback', gustos:'heart', viaje:'plane' };
const BLOB_HUES = ['c-learn','c-remember','c-test','c-practical','c-think','c-expression'];
const BLOB_SHAPES = ['b1','b2','b3','b4'];
function hashStr(s){ let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; }
/* key used to make sure two choices never share a picture */
function artKey(es){ return WORD_ART[es] || (NUM_ART[es] && 'n' + NUM_ART[es]) || (DAY_ART[es] && 'd' + DAY_ART[es]) || null; }
const hasArt = it => it.kind === 'w' && (artKey(it.es[0]) || (typeof IMAGES !== 'undefined' && IMAGES[it.es[0]]));
function artSvg(id){
  if (id === '#') return '<svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="16.5" text-anchor="middle" class="art-txt" font-size="11">123</text></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ART[id] || ART.sparkle) + '</svg>';
}
/* A picture on layered blobs. size: 'sm' | 'md' | 'lg' */
function blobArt(es, size, seedOverride){
  const seed = hashStr(seedOverride || es);
  const hue = BLOB_HUES[seed % BLOB_HUES.length], shape = BLOB_SHAPES[(seed >>> 3) % BLOB_SHAPES.length];
  const wrap = h('span', { class:'blob-art ' + (size || 'md') + ' ' + hue + ' ' + shape, 'aria-hidden':'true' },
    h('span', { class:'blob back' }), h('span', { class:'blob front' }), h('span', { class:'blob shine' }));
  const url = typeof IMAGES !== 'undefined' && IMAGES[es];
  const drawn = () => { const n = NUM_ART[es], d = DAY_ART[es];
    if (n) return h('span', { class:'art art-num' }, n);
    if (d) return h('span', { class:'art art-day', html: artSvg('calendar') }, h('b', {}, d));
    return h('span', { class:'art', html: artSvg(WORD_ART[es] || UNIT_ART[es] || es) }); };
  if (url){
    const img = h('img', { class:'art art-photo', src:url, alt:'', loading:'lazy', decoding:'async' });
    img.addEventListener('error', () => img.replaceWith(drawn()));
    wrap.append(img);
  } else wrap.append(drawn());
  return wrap;
}

function routeMap(){

  const svg = el('svg', { viewBox:'0 0 360 150', class:'route', role:'img', 'aria-label':'Your route from Beginner to Intermediate' });
  const D = 'M18 118 C 70 120, 70 60, 120 62 S 190 112, 238 88 S 300 26, 342 34';
  const base = el('path', { d:D, class:'road' }), dash = el('path', { d:D, class:'road-mid' }), done = el('path', { d:D, class:'road-done' });
  svg.append(base, dash, done);
  const wrap = h('div', { class:'route-wrap' }); wrap.append(svg);
  requestAnimationFrame(() => {
    const L = base.getTotalLength(); if (!L) return;
    const fr = BAND_LIST.reduce((n,b) => n + bandPct(b), 0) / (BAND_LIST.length * 100);
    done.style.strokeDasharray = L; done.style.strokeDashoffset = L;

    BAND_LIST.forEach((b, i) => {

    h('button', { class:'btn text', type:'button', onclick:() => skip('Speaking is off for the rest of this session.') }, 'Can\'t talk right now')));
  ctx = { ready:false, best:[], check:() => {
    const want = deacc(norm(ex.answers[0])).split(' ');
    let bestScore = 0;
    for (const a of ctx.best){ const got = deacc(norm(a)).split(' '); const hit = want.filter(w => got.includes(w)).length; bestScore = Math.max(bestScore, hit / want.length); }
    return bestScore >= 0.75 ? { ok:true, note: bestScore < 1 ? 'Close enough. Listen once more to polish it.' : '' } : { ok:false, note:'Try to say every word. Tap play to hear it again.' };
  } };
}

/* ---------- word hints ---------- */
function glossify(text){
  const out = []; const words = String(text || '').split(/\s+/).filter(Boolean);
  let i = 0;
  while (i < words.length){
    let n = 1, g = null;
    for (let k = Math.min(4, words.length - i); k >= 2; k--){
      const key = words.slice(i, i+k).map(w => clean(w).toLowerCase()).join(' ');
      if (PHRASES[key]){ n = k; g = PHRASES[key]; break; }
    }
    if (!g){ const k = clean(words[i]).toLowerCase(); g = GLOSS[k] || WG[k] || null; }
    const raw = words.slice(i, i+n).join(' ');
    const lead = raw.match(/^[¿¡]*/)[0], trail = raw.match(/[?!.,;:]*$/)[0], core = raw.slice(lead.length, raw.length - trail.length);
    if (lead) out.push(lead);
    out.push(g && core ? h('span', { class:'w', tabindex:'0', 'data-g':g }, core) : core);
    if (trail) out.push(trail);
    i += n; if (i < words.length) out.push(' ');
  }
  return h('span', { class:'gl', lang:'es' }, out);
}
let tipFor = null;
function showTip(el){
  const t = $('#wtip'); t.textContent = el.getAttribute('data-g'); t.hidden = false; tipFor = el;
  document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on')); el.classList.add('on');
  const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight, vw = document.documentElement.clientWidth;
  let top = r.top - th - 8; if (top < 8) top = r.bottom + 8;
  const left = Math.max(8, Math.min(vw - tw - 8, r.left + r.width/2 - tw/2));
  t.style.top = top + 'px'; t.style.left = left + 'px';
}
function hideTip(){ const t = document.getElementById('wtip'); if (t) t.hidden = true; tipFor = null; document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on')); }
function wireTips(){
  let touch = false;
  document.addEventListener('touchstart', () => { touch = true; }, { passive:true });
  document.addEventListener('mouseover', e => { if (touch) return; const w = e.target.closest && e.target.closest('.w'); if (w) showTip(w); });
  document.addEventListener('mouseout', e => { if (touch) return; const w = e.target.closest && e.target.closest('.w'); if (w && !w.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('w')) showTip(e.target); });
  document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('w')) hideTip(); });
  document.addEventListener('click', e => { const w = e.target.closest && e.target.closest('.w');
    if (w){ showTip(w); say(w.textContent); } else hideTip(); });
  window.addEventListener('scroll', hideTip, { passive:true });
}

/* ---------- notes & settings sheets ---------- */
