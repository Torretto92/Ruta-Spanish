<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta Spanish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14110E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one 620px column. Home is a tabbed app (Learn · Practise · Scroll · Listen · Me) with a fixed bottom bar.
   Look: "noche andaluza", a warm dark evening ground, cream ink, saffron accent; each content kind has its own soft colour. */
:root{
  --bg:#14110E; --surface:#1E1914; --sunk:#2A231C; --ink:#F5EEE3; --muted:#ABA093; --line:#3A3128;
  --accent:#E2A541; --accent-2:#9C6A1C; --on-accent:#1C1307; --accent-soft:#3A2A14;
  --sun:#F0C05A; --good:#93BF7E; --good-bg:#1F2A1A; --bad:#E4846F; --bad-bg:#3A1E18;
  --c-learn:#E2A541; --c-remember:#86BFA6; --c-test:#E4846F; --c-practical:#C9C27A; --c-think:#8EAEE0; --c-expression:#D79BB8;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F6F0E6; --surface:#FFFCF6; --sunk:#EEE4D4; --ink:#2A2119; --muted:#74675A; --line:#E2D6C4;
  --accent:#B4741A; --accent-2:#80520F; --on-accent:#FFF8EC; --accent-soft:#F5E2C0;
  --sun:#B8820F; --good:#3F7A35; --good-bg:#E3EED8; --bad:#B4432C; --bad-bg:#F7E0D8;
  --c-learn:#B4741A; --c-remember:#3E8467; --c-test:#B4432C; --c-practical:#7C7524; --c-think:#3F64A6; --c-expression:#A2486F; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F6F0E6; --surface:#FFFCF6; --sunk:#EEE4D4; --ink:#2A2119; --muted:#74675A; --line:#E2D6C4;
  --accent:#B4741A; --accent-2:#80520F; --on-accent:#FFF8EC; --accent-soft:#F5E2C0;
  --sun:#B8820F; --good:#3F7A35; --good-bg:#E3EED8; --bad:#B4432C; --bad-bg:#F7E0D8;
  --c-learn:#B4741A; --c-remember:#3E8467; --c-test:#B4432C; --c-practical:#7C7524; --c-think:#3F64A6; --c-expression:#A2486F; color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{text-wrap:balance;margin:0}
i{font-style:italic}
main{max-width:620px;margin:0 auto;padding-block:16px 120px}
body.in-lesson main{padding-bottom:150px}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;line-height:1.2;transition:transform .08s, background .15s, filter .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-2)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.primary:disabled{background:var(--sunk);color:var(--muted);box-shadow:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:disabled{color:var(--muted);border-style:dashed}
.btn.text{background:none;color:var(--accent);padding:8px 10px}
.btn.small{padding:9px 16px;font-size:14.5px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn.danger-ghost{background:none;border:1.5px solid var(--bad);color:var(--bad)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);flex:none}
.icon-btn svg{width:21px;height:21px}
.icon-btn.big{width:50px;height:50px;background:var(--accent);color:var(--on-accent)}
.icon-btn.big svg{width:26px;height:26px}
.icon-btn.tiny{width:32px;height:32px}
.icon-btn.tiny svg{width:17px;height:17px}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.eyebrow i{font-family:var(--display);letter-spacing:.02em;text-transform:none;font-weight:400;font-size:14px;color:var(--muted)}
.kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cc, var(--accent))}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.kicker i{font-family:var(--display);letter-spacing:.02em;text-transform:none;font-weight:400;font-size:14px;color:var(--muted)}
.small{font-size:14px;color:var(--muted);margin:0}
.meter{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--sun);border-radius:3px;transition:width .4s ease}
.c-learn{--cc:var(--c-learn)} .c-remember{--cc:var(--c-remember)} .c-test{--cc:var(--c-test)}
.c-practical{--cc:var(--c-practical)} .c-think{--cc:var(--c-think)} .c-expression{--cc:var(--c-expression)}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none;color:var(--accent)}
.mark svg{width:100%;height:100%;display:block}
.brand-name{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:.01em;line-height:1}
.tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:3px 7px}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink)}
.pill.streak{color:var(--sun);background:var(--accent-soft);border-color:transparent}
.pill.lv{color:var(--ink)}
.flame{display:inline-flex} .flame svg{width:15px;height:15px}

/* hero + route */
.hero{display:grid;gap:12px;text-align:center;justify-items:center;margin-bottom:16px}
.hero-t{font-family:var(--display);font-weight:500;font-size:clamp(30px,8.4vw,42px);line-height:1.1;letter-spacing:-.005em}
.hero-t span{font-style:italic;color:var(--accent)}
.route-wrap{width:100%}
.route{width:100%;height:auto;display:block;overflow:visible}
.road{fill:none;stroke:var(--sunk);stroke-width:14;stroke-linecap:round}
.road-mid{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 7}
.road-done{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.7,.2,1)}
.stop{fill:var(--surface);stroke:var(--line);stroke-width:2}
.stop.full{fill:var(--accent);stroke:var(--accent)}
.stop-c{font:800 7px var(--body);fill:var(--muted);letter-spacing:.04em}
.stop.full + .stop-c{fill:var(--on-accent)}
.stop-l{font:700 10.5px var(--body);fill:var(--muted)}
.stop-start{fill:var(--muted)}
.me{fill:var(--sun);stroke:var(--bg);stroke-width:2}
.me-glow{fill:var(--sun);opacity:.22;animation:glow 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{transform:scale(1.5);opacity:.08}}
.goal{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.goal b{color:var(--ink);font-variant-numeric:tabular-nums}
.page-head{display:grid;gap:8px;margin-bottom:18px}

/* daily five */
.daily{display:grid;gap:14px;margin-bottom:14px}
.daily h2 i{font-size:16px;color:var(--muted)}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.d-btn{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:4px 0;min-width:0}
.d-ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--cc);color:var(--cc);transition:transform .15s}
.d-ring svg{width:24px;height:24px}
.d-btn:hover .d-ring{transform:translateY(-2px)}
.d-btn.done .d-ring{border-style:solid;background:var(--cc);color:var(--bg)}
.d-l{font-size:12.5px;font-weight:800;white-space:nowrap}
.d-es{font-family:var(--display);font-style:italic;font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:380px){ .d-ring{width:44px;height:44px} .d-l{font-size:11.5px} }

/* levels */
.levels{display:grid;gap:12px;margin-bottom:14px}
.levels-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.levels-head h2,.card-h{font-family:var(--display);font-weight:500;font-size:21px}
.levels-total{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.lvl-row{display:grid;grid-template-columns:auto minmax(92px,auto) minmax(0,1fr) 3.2em;align-items:center;gap:10px}
.band-code{font-family:var(--body);font-weight:800;font-size:11.5px;letter-spacing:.08em;color:var(--accent);border:1.5px solid currentColor;border-radius:6px;padding:1px 6px}
.lvl-name{font-weight:700;display:flex;flex-direction:column;line-height:1.2}
.lvl-name small{font-weight:500;color:var(--muted);font-size:12px}
.lvl-row:not(.active) .lvl-name{color:var(--muted)}
.lvl-bar{display:block;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.lvl-bar span{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .6s ease}
.lvl-row.full .lvl-bar span{background:var(--good)}
.lvl-pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* nudge / tiles */
.nudge,.tile-card{width:100%;text-align:left;display:grid;gap:6px;border-left:3px solid var(--cc);margin-bottom:14px}
.nudge-t{font-family:var(--display);font-size:23px;font-weight:500;line-height:1.2}
.tile-card:disabled{opacity:.55}
.tile-card:not(:disabled):hover,.nudge:hover{background:var(--sunk)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.grid .tile-card{margin:0}
.big-num{font-family:var(--display);font-size:46px;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums}
.big-num small{font-family:var(--body);font-size:15px;color:var(--muted)}

/* unit path */
.band{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:24px;margin:28px 0 12px}
.band-pct{margin-left:auto;font-family:var(--body);font-size:13.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.path{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.unit{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.unit.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.unit.locked .unit-t,.unit.locked .unit-n{opacity:.5}
.unit-n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.unit.current .unit-n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.unit.mastered .unit-n{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.unit-t{display:flex;flex-direction:column;min-width:0}
.unit-es{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.25}
.unit-en{color:var(--muted);font-size:13.5px}
.pips{display:flex;gap:4px;margin-top:7px}
.pips span{width:16px;height:4px;border-radius:2px;background:var(--sunk)}
.pips span.on{background:var(--sun)}
.unit-actions{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.foot{color:var(--muted);font-size:13.5px;margin-top:28px;text-align:center}

/* scroll */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:4px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.feed{display:grid;gap:14px;padding-top:14px}
.sc-card{display:grid;gap:12px;border-top:3px solid var(--cc);padding:18px 20px 20px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.keep{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.keep svg{width:20px;height:20px;fill:none}
.keep svg path{fill:transparent;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.keep[aria-pressed="true"]{color:var(--accent)}
.keep[aria-pressed="true"] svg path{fill:currentColor}
.sc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc-es{font-family:var(--display);font-size:clamp(26px,7vw,34px);font-weight:500;line-height:1.2;margin:0;min-width:0;overflow-wrap:anywhere}
.sc-en{margin:0;font-size:18px;font-weight:600}
.sc-meta{margin:0;color:var(--muted);font-size:13.5px}
.sc-title{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2}
.sc-title.big{font-size:32px}
.sc-text{color:var(--muted);max-width:62ch}
.sc-text p{margin:0 0 .6em} .sc-text p:last-child{margin:0}
.sc-text i,.sc-text b,.tip i{font-style:normal;font-weight:700;color:var(--ink)}
.sc-q{margin:0;font-size:18px;font-weight:600}
.sc-ex{margin:0;font-size:18px;font-style:italic}
.sc-answer{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.sc-answer p{margin:0}
.reveal{justify-self:start;background:none;border:0;padding:0;color:var(--cc);font-weight:700}
.more{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}

/* listen */
.player{display:grid;gap:14px;margin-bottom:14px}
.lbl{font-weight:700;font-size:14px;color:var(--muted)}
.now{background:var(--sunk);border-radius:12px;padding:22px 16px;text-align:center;min-height:128px;display:grid;align-content:center;gap:6px}
.ls-es{margin:0;font-family:var(--display);font-size:clamp(24px,6.6vw,32px);font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.ls-en{margin:0;color:var(--muted)}
.ls-track{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.ls-track .meter span{background:var(--accent)}
.ls-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl{width:52px;height:52px}
.big-play{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-2)}
.big-play svg{width:34px;height:34px}
.narrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.narr{display:grid;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.narr.on{border-color:var(--accent);background:var(--accent-soft)}
.narr-pick{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.narr-pick small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.narr-a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);flex:none}
select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk)}

/* me */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.stat-v small{font-size:13px;color:var(--muted);font-weight:500}
.settings{display:grid;gap:16px}
.settings h3{font-family:var(--display);font-weight:500;font-size:19px;margin-top:6px}
.me-bar{margin-top:10px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav-b{position:relative;display:grid;justify-items:center;gap:3px;background:none;border:0;padding:8px 2px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.nav-i{display:inline-flex} .nav-i svg{width:22px;height:22px}
.nav-b.on{color:var(--accent)}
.nav-b.on::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

@media (max-width:520px){
  .unit{grid-template-columns:42px minmax(0,1fr)}
  .unit-actions{grid-column:2;justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .lvl-row{grid-template-columns:auto minmax(0,1fr) 3em}
  .lvl-row .lvl-bar{grid-column:1 / -1;grid-row:2}
  .pill{padding:5px 10px}
}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.lesson-top .icon-btn{background:transparent;color:var(--muted)}
.track{flex:1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
#bar-fill{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .35s ease}
.quit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:-12px 0 20px}
.quit span{flex:1 1 200px}
.ex{display:flex;flex-direction:column;gap:18px}
.ex.in{animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.ex-label{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ex-label.new{color:var(--sun)}
.big-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:500;font-size:clamp(30px,7.6vw,42px);line-height:1.2;min-width:0;overflow-wrap:anywhere}
.big.long{font-size:clamp(24px,5.8vw,32px)}
.audio{display:flex;gap:8px;align-items:center}
.listen{display:flex;justify-content:center;padding:18px 0}
.listen .icon-btn.big{width:84px;height:84px} .listen .icon-btn.big svg{width:40px;height:40px}
.listen .icon-btn:not(.big){width:52px;height:52px}
.hint{margin:-8px 0 0;color:var(--muted);font-style:italic}
.intro-en{font-size:22px;margin:0}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.opt .k{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:none}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;
  background:repeating-linear-gradient(to bottom, transparent 0 55px, var(--line) 55px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 2px 0 var(--line)}
.tile.gone{background:var(--sunk);color:transparent;box-shadow:none;border-color:var(--sunk)}
.answer{width:100%;font-size:20px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.answer:focus{outline:none;border-color:var(--accent)}
.answer.right{border-color:var(--good);background:var(--good-bg)}
.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.key{min-width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:18px}
.conj{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-left:4px solid var(--sun)}
.conj-verb{font-family:var(--display);font-size:34px;line-height:1.1}
.conj-meta{color:var(--muted)}
.conj-person{font-size:22px;font-weight:800}
.fill-line{font-family:var(--display);font-size:clamp(24px,5.8vw,32px);line-height:1.6;margin:0}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--accent);padding:0 6px;color:var(--accent)}
.blank.right{border-color:var(--good);color:var(--good)} .blank.wrong{border-color:var(--bad);color:var(--bad)}
.hint.en{font-style:normal}
.chips .chip{letter-spacing:0;font-size:15px;font-weight:600}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.pair{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:52px;box-shadow:0 2px 0 var(--line);overflow-wrap:anywhere}
.pair[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pair.done{opacity:.35;box-shadow:none;border-color:var(--good)}
.shake{animation:shake .35s; border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;text-align:left;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--surface)}
.bubble.l{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.r{align-self:flex-end;border-bottom-right-radius:4px;background:var(--accent-soft);border-color:transparent}
.bubble .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bubble .tr{display:none;color:var(--muted);font-size:15px}
.bubble.shown .tr{display:block}
.reply-cue{margin:4px 0 -8px;font-weight:800}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 24px;background:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 3px 0 var(--accent-2)}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--bad);box-shadow:0 3px 0 var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.heard{margin:0;min-height:1.5em;color:var(--muted)}
.w{border-bottom:2px dotted var(--muted);cursor:help;border-radius:2px}
.w:hover,.w.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.cue{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.wtip{position:fixed;z-index:40;max-width:260px;background:var(--ink);color:var(--bg);font-family:var(--body);font-weight:600;font-size:14.5px;line-height:1.35;padding:7px 11px;border-radius:8px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* check bar */
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.checkbar-in{max-width:620px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
#bar-msg{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--muted)}
#bar-msg:empty{display:none}
#bar-btn{flex:1 1 160px}
.checkbar.good{background:var(--good-bg);border-color:var(--good)}
.checkbar.good #bar-msg{color:var(--good)}
.checkbar.good #bar-btn{background:var(--good);color:var(--bg);box-shadow:none}
.checkbar.bad{background:var(--bad-bg);border-color:var(--bad)}
.checkbar.bad #bar-msg{color:var(--bad)}
.checkbar.bad #bar-btn{background:var(--bad);color:var(--bg);box-shadow:none}
.verdict{font-family:var(--display);font-weight:500;font-size:24px}
.mean{color:var(--ink);font-style:italic}

/* done */
.done-card{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.done-card h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,7.6vw,40px);line-height:1.15}
.done-note{margin:0;color:var(--muted)}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.done-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.done-stats dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.done-stats dd{margin:0;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.done-card .levels{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.missed h3,.sheet-body h3{font-family:var(--display);font-weight:500;font-size:21px;margin:6px 0 8px}
.missed ul,.vocab{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.missed li,.vocab li{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.m-es{font-weight:700} .m-en{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,6,4,.6);display:flex;justify-content:center;align-items:flex-end}
.sheet-panel{background:var(--bg);width:100%;max-width:660px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet-head h2{font-family:var(--display);font-weight:500;font-size:30px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 18px;max-width:65ch;color:var(--muted)}
.vt-wrap{overflow-x:auto}
.vt{border-collapse:collapse;min-width:280px;background:var(--surface);border-radius:12px;overflow:hidden}
.vt caption{text-align:left;font-weight:800;padding:0 0 6px}
.vt th,.vt td{padding:7px 14px;border-bottom:1px solid var(--line);text-align:left}
.vt th{color:var(--muted);font-weight:500}
.vt td{font-weight:800}
.field{display:grid;gap:8px;justify-items:start}
.field>label{font-weight:800}
.field select{max-width:100%}
.range{display:flex;align-items:center;gap:12px;width:100%}
.range input{flex:1;accent-color:var(--accent)}
.switch{display:flex;gap:12px;align-items:flex-start;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.switch small{display:block;font-weight:500;color:var(--muted)}
textarea{width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.status{margin:0;font-weight:800;color:var(--accent);min-height:1.5em}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-bg);border-radius:12px;padding:12px}
.confirm span{flex:1 1 200px;color:var(--bad);font-weight:800}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head>
<body>
<main>
  <section id="home" aria-label="Ruta"></section>

  <section id="lesson" hidden aria-label="Lesson">
    <div class="lesson-top">
      <button id="close-lesson" class="icon-btn" type="button" aria-label="Quit lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="track" aria-hidden="true"><span id="bar-fill"></span></div>
    </div>
    <div id="quit" class="quit" hidden>
      <span>Quit this lesson? Answers so far still count toward your reviews.</span>
      <button id="quit-keep" class="btn small soft" type="button">Keep going</button>
      <button id="quit-go" class="btn small text" type="button">Quit</button>
    </div>
    <div id="stage" aria-live="polite"></div>
    <div id="checkbar" class="checkbar">
      <div class="checkbar-in">
        <div id="bar-msg" role="status"></div>
        <button id="bar-btn" class="btn primary" type="button" disabled>Check</button>
      </div>
    </div>
  </section>

  <section id="done" hidden aria-label="Results"></section>
</main>

<nav id="nav" class="nav" aria-label="Sections"></nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-head"><h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="wtip" class="wtip" hidden role="tooltip"></div>
<script>
/* Ruta Spanish — course content.
   Format for words and sentences:  "Spanish|alt Spanish = English|alt English ~ optional hint"
   Dialogue lines:                  "Speaker: Spanish = English"
   Add new units to the end of COURSE and they appear on the path automatically. */

const VERBS = {
  'ser|pres':    ['soy','eres','es','somos','sois','son'],
  'estar|pres':  ['estoy','estás','está','estamos','estáis','están'],
  'tener|pres':  ['tengo','tienes','tiene','tenemos','tenéis','tienen'],
  'ir|pres':     ['voy','vas','va','vamos','vais','van'],
  'hablar|pres': ['hablo','hablas','habla','hablamos','habláis','hablan'],
  'comer|pres':  ['como','comes','come','comemos','coméis','comen'],
  'vivir|pres':  ['vivo','vives','vive','vivimos','vivís','viven'],
  'querer|pres': ['quiero','quieres','quiere','queremos','queréis','quieren'],
  'poder|pres':  ['puedo','puedes','puede','podemos','podéis','pueden'],
  'hacer|pres':  ['hago','haces','hace','hacemos','hacéis','hacen'],
  'hablar|pret': ['hablé','hablaste','habló','hablamos','hablasteis','hablaron'],
  'comer|pret':  ['comí','comiste','comió','comimos','comisteis','comieron'],
  'ir|pret':     ['fui','fuiste','fue','fuimos','fuisteis','fueron'],
  'hacer|pret':  ['hice','hiciste','hizo','hicimos','hicisteis','hicieron'],
  'tener|pret':  ['tuve','tuviste','tuvo','tuvimos','tuvisteis','tuvieron']
};
const VERB_EN = { ser:'to be', estar:'to be', tener:'to have', ir:'to go', hablar:'to speak', comer:'to eat',
  vivir:'to live', querer:'to want', poder:'to be able to', hacer:'to do, to make' };

const COURSE = [
{ id:'saludos', es:'Saludos', en:'Greetings', band:'A1',
  tip:`<p>Spanish questions open with <b>¿</b> and exclamations with <b>¡</b>: <i>¿Qué tal?</i> <i>¡Hola!</i></p>
<p>Vowels always sound the same: <b>a</b> as in father, <b>e</b> as in met, <b>i</b> as in machine, <b>o</b> as in more (short), <b>u</b> as in rule. <b>h</b> is silent, <b>ñ</b> sounds like "ny", <b>ll</b> and <b>y</b> like "y", and <b>j</b> like a throaty "h".</p>
<p>Accent marks matter: <i>sí</i> means yes, <i>si</i> means if. Ruta forgives a missing accent but points it out.</p>
<p><b>Tú</b> is informal "you" (friends, family). <b>Usted</b> is formal (strangers, older people, service staff).</p>`,
  words:['hola = hello|hi','adiós = goodbye|bye','buenos días = good morning','buenas tardes = good afternoon',
    'buenas noches = good night|good evening','gracias = thank you|thanks','por favor = please','sí = yes','no = no',
    'perdón = sorry|excuse me','de nada = you\'re welcome','¿qué tal? = how\'s it going?|how are you?'],
  sents:['Hola, ¿qué tal? = Hello, how are you?|Hi, how are you?|Hi, how\'s it going?|Hello, how\'s it going?',
    'Muy bien, gracias. = Very well, thank you.|Very well, thanks.|Very good, thanks.|Very good, thank you.',
    'Buenos días, señora. = Good morning, ma\'am.|Good morning, madam.',
    'Me llamo Ana. = My name is Ana.|I\'m called Ana.|I am called Ana.',
    '¿Cómo te llamas? = What\'s your name?|What is your name?',
    'Mucho gusto. = Nice to meet you.|Pleased to meet you.',
    'Hasta luego. = See you later.'],
  dlg:['Marco: ¡Hola! ¿Qué tal? = Hi! How\'s it going?',
    'Lucía: Muy bien, gracias. ¿Y tú? = Very well, thanks. And you?',
    'Marco: Bien. ¿Cómo te llamas? = Good. What\'s your name?',
    'Lucía: Me llamo Lucía. ¿Y tú? = My name is Lucía. And you?',
    'Marco: Soy Marco. Mucho gusto. = I\'m Marco. Nice to meet you.',
    'Lucía: Encantada. = Delighted to meet you.'] },

{ id:'personas', es:'Personas', en:'People and "ser"', band:'A1', verbs:['ser|pres'],
  tip:`<p>Every noun is masculine or feminine. "The" is <b>el</b> (masculine) or <b>la</b> (feminine); "a" is <b>un</b> or <b>una</b>.</p>
<p><b>Ser</b> means "to be" for identity, origin and what someone is like: <i>Soy de Australia</i>, <i>Es simpático</i>.</p>
<p>Spanish usually drops the pronoun because the verb ending already says who: <i>Soy Carlos</i> = I'm Carlos. Ruta accepts both.</p>`,
  words:['yo = I','tú = you ~ informal','él = he','ella = she','nosotros = we','ellos = they',
    'el hombre = the man|man','la mujer = the woman|woman','el niño = the boy|boy|the child','la niña = the girl|girl',
    'el amigo = the friend|friend','soy = I am|I\'m ~ ser','eres = you are|you\'re ~ ser','somos = we are|we\'re ~ ser'],
  sents:['Yo soy Carlos. = I am Carlos.|I\'m Carlos.','Ella es mi amiga. = She is my friend.|She\'s my friend.',
    'Tú eres muy simpático. = You are very nice.|You\'re very nice.','Somos amigos. = We are friends.|We\'re friends.',
    'Él es un hombre. = He is a man.|He\'s a man.','Ellos son de México. = They are from Mexico.|They\'re from Mexico.',
    '¿De dónde eres? = Where are you from?','Soy de Australia. = I am from Australia.|I\'m from Australia.'] },

{ id:'numeros', es:'Números', en:'Numbers', band:'A1',
  tip:`<p><b>Hay</b> means both "there is" and "there are": <i>Hay tres gatos</i>.</p>
<p>Age uses <b>tener</b> (to have): <i>Tengo veinte años</i>, literally "I have twenty years".</p>
<p>16 to 29 are written as one word: dieciséis, diecisiete, veintiuno, veintidós…</p>
<p>Time: <i>Es la una</i> (one o'clock) but <i>Son las dos, son las diez</i>.</p>`,
  words:['uno = one|1','dos = two|2','tres = three|3','cuatro = four|4','cinco = five|5','seis = six|6','siete = seven|7',
    'ocho = eight|8','nueve = nine|9','diez = ten|10','once = eleven|11','doce = twelve|12','veinte = twenty|20','cien = a hundred|one hundred|100'],
  sents:['Tengo dos hermanos. = I have two brothers.|I have two siblings.','Hay tres gatos. = There are three cats.',
    '¿Cuántos años tienes? = How old are you?','Tengo veinte años. = I am twenty years old.|I\'m twenty years old.|I am twenty.|I\'m twenty.',
    'Son las diez. = It is ten o\'clock.|It\'s ten o\'clock.|It is ten.|It\'s ten.','El número es cinco. = The number is five.'] },

{ id:'comida', es:'Comida', en:'Food and drink', band:'A1',
  tip:`<p>The present tense covers both "I eat" and "I am eating": <i>como</i>.</p>
<p>To make a sentence negative, put <b>no</b> before the verb: <i>No como carne</i>.</p>
<p><i>El agua</i> is feminine (<i>el agua fría</i>) but takes <b>el</b> because it starts with a stressed "a".</p>`,
  words:['el agua = water|the water','el pan = bread|the bread','la leche = milk|the milk','el café = coffee|the coffee',
    'la manzana = apple|the apple|an apple','el queso = cheese|the cheese','la carne = meat|the meat','el pescado = fish|the fish ~ as food',
    'el arroz = rice|the rice','la cerveza = beer|the beer','como = I eat ~ comer','bebo = I drink ~ beber'],
  sents:['Yo como pan. = I eat bread.|I am eating bread.|I\'m eating bread.','Bebo agua. = I drink water.|I am drinking water.|I\'m drinking water.',
    'Ella come una manzana. = She eats an apple.|She is eating an apple.|She\'s eating an apple.',
    'Quiero un café, por favor. = I want a coffee, please.|I\'d like a coffee, please.',
    'No como carne. = I don\'t eat meat.|I do not eat meat.','El queso es bueno. = The cheese is good.'] },

{ id:'familia', es:'Familia', en:'Family', band:'A1',
  tip:`<p>Possessives: <b>mi / mis</b> (my), <b>tu / tus</b> (your), <b>su / sus</b> (his, her, their, or formal your). Add -s with plural nouns: <i>mis padres</i>.</p>
<p>A masculine plural covers mixed groups: <i>los padres</i> = parents, <i>los hermanos</i> = brothers and sisters.</p>
<p>No article before a job after <i>ser</i>: <i>Es profesora</i> = She's a teacher.</p>`,
  words:['la madre = mother|the mother|mum|mom','el padre = father|the father|dad','el hermano = brother|the brother',
    'la hermana = sister|the sister','el hijo = son|the son','la hija = daughter|the daughter','los padres = parents|the parents',
    'el abuelo = grandfather|grandpa|the grandfather','la abuela = grandmother|grandma|the grandmother','mi = my',
    'tu = your ~ informal','su = his|her|their ~ also formal "your"'],
  sents:['Mi madre es profesora. = My mother is a teacher.|My mum is a teacher.|My mom is a teacher.',
    'Tu hermano es alto. = Your brother is tall.','Tengo una hermana. = I have a sister.|I have one sister.',
    'Mis padres viven en Madrid. = My parents live in Madrid.',
    'Su hija se llama Lucía. = Her daughter is called Lucía.|His daughter is called Lucía.|Her daughter\'s name is Lucía.|His daughter\'s name is Lucía.',
    'Mi abuela es muy simpática. = My grandmother is very nice.|My grandma is very nice.'] },

{ id:'verbos-ar', es:'Verbos en -ar', en:'Regular -ar verbs', band:'A1', verbs:['hablar|pres'],
  tip:`<p>Most Spanish verbs end in <b>-ar</b>. Drop the -ar and add: <b>-o, -as, -a, -amos, -áis, -an</b>.</p>
<p><i>hablar → hablo, hablas, habla, hablamos, habláis, hablan</i></p>
<p><b>Vosotros</b> (you all, informal) is used in Spain. Latin America uses <b>ustedes</b> with the -an form for every "you all".</p>`,
  words:['hablar = to speak|to talk','trabajar = to work','estudiar = to study','escuchar = to listen|to listen to',
    'cocinar = to cook','caminar = to walk','hablo = I speak|I talk','hablas = you speak|you talk',
    'habla = he speaks|she speaks|he talks|she talks','hablamos = we speak|we talk','hablan = they speak|they talk'],
  sents:['Hablo un poco de español. = I speak a little Spanish.','¿Hablas inglés? = Do you speak English?',
    'Trabajamos los lunes. = We work on Mondays.','Ella estudia mucho. = She studies a lot.',
    'Ellos escuchan música. = They listen to music.|They are listening to music.|They\'re listening to music.',
    'Mi padre cocina muy bien. = My father cooks very well.|My dad cooks very well.'] },

{ id:'lugares', es:'Lugares', en:'Places, "estar" and "ir"', band:'A1', verbs:['estar|pres','ir|pres'],
  tip:`<p>Two verbs mean "to be". <b>Estar</b> is for location and temporary states: <i>Estoy en casa</i>, <i>Estoy cansado</i>. <b>Ser</b> is for identity and lasting traits.</p>
<p><b>a + el = al</b>: <i>Vamos al centro</i>. Likewise <b>de + el = del</b>.</p>
<p><b>Ir</b> (to go) is irregular: voy, vas, va, vamos, vais, van.</p>`,

{ id:'tiempo', es:'El tiempo', en:'Days and time', band:'A1',

{ id:'describir', es:'Describir', en:'Describing things', band:'A2',

<script>

'use strict';

  tiles_es2en:{k:['s']}, tiles_en2es:{k:['s']}, fill:{k:['s']}, type_w:{k:['w']}, type_s:{k:['s']},

/* ---------- state ---------- */
function fresh(){ return { v:1, units:{}, srs:{}, xp:0, today:{d:'',xp:0}, streak:{n:0,last:''},

function dstr(t){ const d = new Date(t == null ? Date.now() : t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayXP(){ return S.today.d === dstr() ? S.today.xp : 0; }
function addXP(n){ const t = dstr(); if (S.today.d !== t) S.today = { d:t, xp:0 }; S.today.xp += n; S.xp += n; }
function bumpStreak(){ const t = dstr(); if (S.streak.last === t) return; S.streak.n = S.streak.last === dstr(Date.now()-DAY) ? S.streak.n + 1 : 1; S.streak.last = t; }
function streakNow(){ return (S.streak.last === dstr() || S.streak.last === dstr(Date.now()-DAY)) ? S.streak.n : 0; }
function rec(key, ok){
  const now = Date.now(); const r = S.srs[key] || { b:0, d:now, r:0, w:0 };
  if (ok){ r.b = Math.min(r.b + 1, 6); r.r++; r.d = now + INT[r.b]*DAY; }
  else   { r.b = 0; r.w++; r.d = now + 10*60e3; }

const box = k => S.srs[k] ? S.srs[k].b : -1;

/* ---------- course index ---------- */
function parse(str){

const ITEMS = {}, UNIT_ITEMS = {};
COURSE.forEach((u, ui) => {
  const list = [];

const lvl = i => S.units[COURSE[i].id] || 0;

function maxU(){ let m = 0; COURSE.forEach((u,i) => { if (unlocked(i)) m = i; }); return m; }

/* ---------- text helpers ---------- */
const rnd = n => Math.floor(Math.random()*n);

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[’']/g,'').replace(/[¿¡?!.,;:"“”«»()]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim(); }

  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const PRON = /^(yo|tú|él|ella|nosotros|nosotras|ellos|ellas|usted|ustedes) /;
function variants(s, es){ const v = [norm(s)]; if (es){ const m = v[0].replace(PRON,''); if (m !== v[0]) v.push(m); } return v; }

function gradeText(input, answers, es){
  const n = norm(input); if (!n) return { ok:false };
  const ins = variants(input, es);
  const pairs = []; answers.forEach(a => variants(a, es).forEach(y => ins.forEach(x => pairs.push([x,y,a]))));
  for (const [x,y] of pairs) if (x === y) return { ok:true };
  for (const [x,y,a] of pairs) if (deacc(x) === deacc(y)) return { ok:true, note:'Watch the accents: <b>'+esc(a)+'</b>' };

  if (answers.some(a => deacc(norm(a)) === deacc(n))) return { ok:false, note:'Close, but the accent changes the meaning here.' };

/* ---------- exercise factory ---------- */
function distract(item, field, n, kinds){
  const ans = new Set(item[field].map(x => deacc(norm(x))));
  const same = UNIT_ITEMS[COURSE[item.u].id].filter(i => kinds.includes(i.kind) && i.key !== item.key);
  const all = ALL.filter(i => kinds.includes(i.kind) && i.u <= Math.max(maxU(), item.u) && i.key !== item.key);

    if (out.length >= n) break;
    const ks = i[field].map(x => deacc(norm(x)));

      options:shuffle([item.es[0], ...distract(item,'es',3,[item.kind])]), answers:item.es, optAudio:true });
    case 'listen_mc': return Object.assign(ex, { t:'mc', label:'Tap what you hear', listen:item.es[0],

function buildLesson(ui, level, test){

  const used = {}, seen = new Set(), out = [];

  let count = 0, guard = 0;
  while (count < n && guard++ < 400){
    const type = forced.length ? forced.shift() : pick(types);
    if (!canDo(type)) continue;
    const kinds = TYPES[type].k;
    let cands = pool.filter(i => kinds.includes(i.kind));
    if (level >= 2 && !test && Math.random() < 0.2){ const rc = older.filter(i => kinds.includes(i.kind)); if (rc.length) cands = rc; }
    if (!cands.length) continue;
    const scored = cands.map(i => [i, (used[i.key]||0)*10 + (box(i.key) < 0 && !seen.has(i.key) ? -3 : Math.max(0,box(i.key))) + Math.random()*2.5]);
    scored.sort((a,b) => a[1]-b[1]);

    const ex = makeEx(type, item); if (!ex) continue;
    used[item.key] = (used[item.key]||0) + 1;
    if (!test) for (const it of ex.items) if (it.kind === 'w' && box(it.key) < 0 && !seen.has(it.key)) out.push({ t:'intro', item:it, items:[it] });
    ex.items.forEach(it => seen.add(it.key));

}

/* ---------- word hints ---------- */
function glossify(text){
  const out = []; const words = String(text || '').split(/\s+/).filter(Boolean);
  let i = 0;
  while (i < words.length){
    let n = 1, g = null;
    for (let k = Math.min(4, words.length - i); k >= 2; k--){
      const key = words.slice(i, i+k).map(w => clean(w).toLowerCase()).join(' ');
      if (PHRASES[key]){ n = k; g = PHRASES[key]; break; }
    }
    if (!g){ const k = clean(words[i]).toLowerCase(); g = GLOSS[k] || WG[k] || null; }
    const raw = words.slice(i, i+n).join(' ');
    const lead = raw.match(/^[¿¡]*/)[0], trail = raw.match(/[?!.,;:]*$/)[0], core = raw.slice(lead.length, raw.length - trail.length);
    if (lead) out.push(lead);
    out.push(g && core ? h('span', { class:'w', tabindex:'0', 'data-g':g }, core) : core);
    if (trail) out.push(trail);
    i += n; if (i < words.length) out.push(' ');
  }
  return h('span', { class:'gl', lang:'es' }, out);
}

function wireTips(){

}

/* ---------- notes & settings sheets ---------- */
function openSheet(title, body){
  const sh = $('#sheet'); $('#sheet-title').textContent = title; const b = $('#sheet-body'); b.innerHTML = ''; b.append(...body);
  sh.hidden = false; document.body.classList.add('locked'); $('#sheet-close').focus();
}
function closeSheet(){ $('#sheet').hidden = true; document.body.classList.remove('locked'); }
function openNotes(i){
  const u = COURSE[i];
  const tables = (u.verbs || []).map(vk => { const [v,t] = vk.split('|');
    return h('div', { class:'vt-wrap' }, h('table', { class:'vt' }, h('caption', {}, h('span', { lang:'es' }, v), ', ' + VERB_EN[v] + ' (' + TENSES[t] + ')'),
      h('tbody', {}, PERSONS.map((p, pi) => h('tr', {}, h('th', { scope:'row', lang:'es' }, p), h('td', { lang:'es' }, VERBS[vk][pi])))))); });
  const row = it => h('li', {}, h('button', { class:'icon-btn tiny', type:'button', 'aria-label':'Play '+it.es[0], html:ICON.play, onclick:() => say(it.es[0]) }),
    h('span', { class:'m-es', lang:'es' }, it.es[0]), h('span', { class:'m-en' }, it.en[0]));
  const items = UNIT_ITEMS[u.id];
  openSheet(u.es, [
    h('p', { class:'eyebrow' }, 'Unit ' + (i+1) + ' · ' + u.band + ' · ' + u.en),
    h('div', { class:'tip' , html:u.tip }), ...tables,
    h('h3', {}, 'Words'), h('ul', { class:'vocab' }, items.filter(x => x.kind === 'w').map(row)),
    h('h3', {}, 'Sentences'), h('ul', { class:'vocab' }, items.filter(x => x.kind === 's').map(row)),
    u.lines ? h('h3', {}, 'Conversation') : null,
    u.lines ? h('ul', { class:'vocab' }, u.lines.map(l => h('li', {}, h('button', { class:'icon-btn tiny', type:'button', 'aria-label':'Play line', html:ICON.play, onclick:() => say(l.es[0]) }),
      h('span', { class:'m-es', lang:'es' }, h('b', {}, l.who + ': '), l.es[0]), h('span', { class:'m-en' }, l.en[0])))) : null
  ].filter(Boolean));
}
function backupCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function openSettings(){ openSheet('Settings', settingsNodes()); }
function settingsNodes(){
  pickVoice();
  const rate = h('input', { id:'set-rate', type:'range', min:'0.6', max:'1.1', step:'0.05', value:String(S.settings.rate) });
  const rateOut = h('output', { for:'set-rate' }, Math.round(S.settings.rate*100) + '%');
  rate.addEventListener('input', () => { S.settings.rate = +rate.value; rateOut.textContent = Math.round(S.settings.rate*100) + '%'; save(); });
  const goal = h('select', { id:'set-goal' }, [10,20,30,50,80].map(g => h('option', { value:String(g), selected: S.settings.goal === g }, g + ' XP a day')));
  goal.addEventListener('change', () => { S.settings.goal = +goal.value; save(); });
  const tog = (id, key, label, note) => { const c = h('input', { id, type:'checkbox', checked:S.settings[key] });
    c.addEventListener('change', () => { S.settings[key] = c.checked; save(); });
    return h('label', { class:'switch', for:id }, c, h('span', {}, label, note ? h('small', {}, note) : null)); };
  const code = h('textarea', { id:'set-code', readonly:true, rows:'3' }, backupCode());
  const restore = h('textarea', { id:'set-restore', rows:'3', placeholder:'Paste a backup code here' });
  const status = h('p', { class:'status', 'aria-live':'polite' });
  const confirmRow = h('div', { class:'confirm', hidden:true }, h('span', {}, 'This erases every unit, streak and review. Sure?'),
    h('button', { class:'btn small danger', type:'button', onclick:() => { S = fresh(); save(); closeSheet(); SC.feed = []; renderHome(); toast('Progress reset.'); } }, 'Yes, reset'),
    h('button', { class:'btn small text', type:'button', onclick:() => confirmRow.hidden = true }, 'Cancel'));
  return [
    (() => { const all = TTS ? speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a,b) => voiceScore(b) - voiceScore(a)) : [];
      const sel = h('select', { id:'set-voice' }, all.map(v => h('option', { value:v.name, selected: VOICE && v.name === VOICE.name },
        v.name.replace(/^Microsoft /,'').replace(/ - Spanish.*$/,'') + ' · ' + v.lang + (isMale(v) ? ' · male' : '') + (/natural|neural|online/i.test(v.name) ? ' · clearest' : ''))));
      sel.addEventListener('change', () => { S.settings.voice = sel.value; save(); pickVoice(); say('Hola, ¿qué tal? Vamos a aprender español.'); });
      const anyMale = all.some(isMale);
      return h('div', { class:'field' }, h('label', { for:'set-voice' }, 'Voice'),
        all.length ? sel : h('p', { class:'small' }, 'No Spanish voice found on this device, so listening exercises are skipped.'),
        h('p', { class:'small' }, anyMale ? 'Male voices are picked first. Voices marked "clearest" sound the most natural.'
          : 'This browser has no male Spanish voice. Open Ruta in Microsoft Edge for the clear male voice Álvaro.')); })(),
    h('div', { class:'field' }, h('label', { for:'set-rate' }, 'Voice speed'), h('div', { class:'range' }, rate, rateOut),
      h('button', { class:'btn small soft', type:'button', onclick:() => say('Hola, ¿qué tal? Vamos a aprender español.') }, 'Test voice')),
    h('div', { class:'field' }, h('label', { for:'set-goal' }, 'Daily goal'), goal),
    tog('set-speak', 'speak', 'Speaking exercises', SR ? 'Uses your microphone in Chrome, Edge or Safari.' : 'Not supported in this browser.'),
    tog('set-sfx', 'sfx', 'Sound effects'),
    h('h3', {}, 'Move your progress'),
    h('p', { class:'small' }, 'Progress lives in this browser. Copy this code, then paste it into Ruta on your other device.'),
    code, h('button', { class:'btn small soft', type:'button', onclick:() => {
      code.value = backupCode();
      const done = () => status.textContent = 'Backup code copied.';
      try { navigator.clipboard.writeText(code.value).then(done, () => { code.select(); status.textContent = 'Press Ctrl+C or Cmd+C to copy.'; }); }
      catch(e){ code.select(); status.textContent = 'Press Ctrl+C or Cmd+C to copy.'; } } }, 'Copy backup code'),
    restore, h('button', { class:'btn small soft', type:'button', onclick:() => {
      try { const o = JSON.parse(decodeURIComponent(escape(atob(restore.value.trim())))); if (!o || !o.srs) throw 0;
        adopt(o); save(); renderHome(); status.textContent = 'Progress restored.'; }
      catch(e){ status.textContent = 'That code didn\'t work. Copy the whole code and try again.'; } } }, 'Restore from code'),
    status,
    h('h3', {}, 'Start over'),
    h('button', { class:'btn small danger-ghost', type:'button', onclick:() => confirmRow.hidden = false }, 'Reset all progress'), confirmRow
  ];
}

/* ---------- boot ---------- */
function boot(){
  load(); pickVoice();
  if (TTS && 'onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = () => { pickVoice(); pickEnVoice(); if (TAB === 'listen' && !$('#home').hidden) renderHome(); };
  wireTips();
  $('#bar-btn').addEventListener('click', onBar);
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#close-lesson').addEventListener('click', () => { $('#quit').hidden = false; $('#quit-keep').focus(); });
  $('#quit-keep').addEventListener('click', () => $('#quit').hidden = true);
  $('#quit-go').addEventListener('click', () => { save(); Q = null; renderHome(); show('home'); });
  document.addEventListener('keydown', e => {
    if (!$('#sheet').hidden){ if (e.key === 'Escape') closeSheet(); return; }
    if (!Q || $('#lesson').hidden) return;
    const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Enter'){ if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'bar-btn' && phase === 'answer') return; e.preventDefault(); onBar(); }
    else if (!typing && phase === 'answer' && /^[1-9]$/.test(e.key)){ const b = $('#stage [data-k="'+e.key+'"]'); if (b) b.click(); }
  });
  renderHome(); show('home');
}
if (typeof document !== 'undefined' && document.getElementById('home')) boot();

</script>
