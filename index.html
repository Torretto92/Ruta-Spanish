<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta Spanish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: one centred column (max 640px). Home = streak/goal strip, practice row, then the unit path grouped by CEFR band.
   Lesson = progress bar, one exercise at a time, and a fixed check bar along the bottom edge. */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --sunk:#E2E7F1; --ink:#14203B; --muted:#56627F; --line:#D2D9E7;
  --accent:#1D4DBF; --accent-2:#163C96; --on-accent:#FFFFFF; --accent-soft:#DCE5FA;
  --sun:#D99A00; --good:#13784A; --good-bg:#DCF2E6; --bad:#B4380C; --bad-bg:#FBE3D8;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --ink:#E6EBF6; --muted:#9AA6C3; --line:#28334F;
  --accent:#7097FF; --accent-2:#94B1FF; --on-accent:#0B1120; --accent-soft:#1F2C52;
  --sun:#F2C14E; --good:#45C487; --good-bg:#12321F; --bad:#F2875A; --bad-bg:#3A1C10; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --ink:#E6EBF6; --muted:#9AA6C3; --line:#28334F;
  --accent:#7097FF; --accent-2:#94B1FF; --on-accent:#0B1120; --accent-soft:#1F2C52;
  --sun:#F2C14E; --good:#45C487; --good-bg:#12321F; --bad:#F2875A; --bad-bg:#3A1C10; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
main{max-width:640px;margin:0 auto;padding-block:20px 140px}

/* buttons */
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;line-height:1.2;transition:transform .08s, background .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-2)}
.btn.primary:disabled{background:var(--sunk);color:var(--muted);box-shadow:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.ghost:disabled{color:var(--muted);border-style:dashed}
.btn.text{background:none;color:var(--accent);padding:8px 10px}
.btn.small{padding:8px 16px;font-size:15px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.danger-ghost{background:none;border:2px solid var(--bad);color:var(--bad)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.big{width:52px;height:52px;background:var(--accent);color:var(--on-accent)}
.icon-btn.big svg{width:28px;height:28px}
.icon-btn.tiny{width:32px;height:32px}
.icon-btn.tiny svg{width:18px;height:18px}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:10px;flex:none;
  background:
    radial-gradient(circle at 50% 50%, var(--sun) 0 18%, transparent 19%),
    conic-gradient(from 45deg, var(--accent) 0 25%, var(--surface) 0 50%, var(--accent) 0 75%, var(--surface) 0) 0 0/22px 22px;
  border:2px solid var(--accent)}
.brand h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat-v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.stat-v small{font-size:14px;color:var(--muted);font-weight:400}
.streak{display:flex;align-items:center;gap:4px}
.flame{display:inline-flex;color:var(--sun)} .flame svg{width:22px;height:22px}
.meter{display:block;height:6px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--sun);border-radius:3px}
.levels{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-bottom:14px}
.levels-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.levels-head h2{font-family:var(--display);font-weight:400;font-size:20px}
.levels-total{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.lvl-row{display:grid;grid-template-columns:auto minmax(96px,auto) minmax(0,1fr) 3.2em;align-items:center;gap:10px}
.lvl-row .band-code{font-size:12px}
.lvl-name{font-weight:700;display:flex;flex-direction:column;line-height:1.2}
.lvl-name small{font-weight:400;color:var(--muted);font-size:12px}
.lvl-row:not(.active) .lvl-name{color:var(--muted)}
.lvl-bar{display:block;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.lvl-bar span{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .5s ease}
.lvl-row.full .lvl-bar span{background:var(--good)}
.lvl-pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.band-pct{margin-left:auto;font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.practice{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.practice .btn{flex:1 1 160px}
.band{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:400;font-size:22px;margin:26px 0 10px}
.band-code{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--accent);border:2px solid var(--accent);border-radius:6px;padding:1px 7px}
.path{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.unit{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:12px 14px;border:2px solid transparent}
.unit.current{border-color:var(--accent)}
.unit.locked .unit-t,.unit.locked .unit-n{opacity:.55}
.unit-n{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.unit.current .unit-n{background:var(--accent);color:var(--on-accent)}
.unit-t{display:flex;flex-direction:column;min-width:0}
.unit-es{font-family:var(--display);font-size:19px;line-height:1.25}
.unit-en{color:var(--muted);font-size:14px}
.pips{display:flex;gap:4px;margin-top:6px}
.pips span{width:14px;height:6px;border-radius:2px;background:var(--sunk)}
.pips span.on{background:var(--sun)}
.unit-actions{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.foot{color:var(--muted);font-size:14px;margin-top:28px;text-align:center}
@media (max-width:520px){
  .unit{grid-template-columns:44px minmax(0,1fr)}
  .unit-actions{grid-column:2;justify-content:flex-start}
  .stat-v{font-size:20px}
  .stats{gap:6px} .stat{padding:10px}
}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.lesson-top .icon-btn{background:transparent;color:var(--muted)}
.track{flex:1;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
#bar-fill{display:block;height:100%;width:0;background:var(--good);border-radius:6px;transition:width .35s ease}
.quit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:-12px 0 20px}
.quit span{flex:1 1 200px}
.ex{display:flex;flex-direction:column;gap:18px}
.ex.in{animation:rise .25s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.ex-label{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex-label.new{color:var(--sun)}
.big-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:clamp(28px, 7vw, 40px);line-height:1.2;min-width:0;overflow-wrap:anywhere}
.big.long{font-size:clamp(22px, 5.4vw, 30px)}
.audio{display:flex;gap:8px;align-items:center}
.listen{display:flex;justify-content:center;padding:18px 0}
.listen .icon-btn.big{width:84px;height:84px} .listen .icon-btn.big svg{width:40px;height:40px}
.listen .icon-btn:not(.big){width:52px;height:52px}
.hint{margin:-8px 0 0;color:var(--muted);font-style:italic}
.intro-en{font-size:22px;margin:0}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.opt .k{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:none}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;
  background:repeating-linear-gradient(to bottom, transparent 0 55px, var(--line) 55px 57px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:0 2px 0 var(--line)}
.tile.gone{background:var(--sunk);color:transparent;box-shadow:none;border-color:var(--sunk)}
.answer{width:100%;font-size:20px;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.answer:focus{outline:none;border-color:var(--accent)}
.answer.right{border-color:var(--good);background:var(--good-bg)}
.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.key{min-width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:18px}
.conj{display:grid;gap:4px;background:var(--surface);border-radius:var(--r);padding:16px 18px;border-left:6px solid var(--sun)}
.conj-verb{font-family:var(--display);font-size:32px;line-height:1.1}
.conj-meta{color:var(--muted)}
.conj-person{font-size:22px;font-weight:700}
.fill-line{font-family:var(--display);font-size:clamp(22px,5.4vw,30px);line-height:1.6;margin:0}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--accent);padding:0 6px;color:var(--accent)}
.blank.right{border-color:var(--good);color:var(--good)} .blank.wrong{border-color:var(--bad);color:var(--bad)}
.hint.en{font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.pair{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;min-height:52px;box-shadow:0 2px 0 var(--line);overflow-wrap:anywhere}
.pair[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pair.done{opacity:.35;box-shadow:none;border-color:var(--good)}
.shake{animation:shake .35s; border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;text-align:left;display:flex;flex-direction:column;border:0;border-radius:16px;padding:10px 14px;background:var(--surface)}
.bubble.l{align-self:flex-start;border-bottom-left-radius:4px}
.bubble.r{align-self:flex-end;border-bottom-right-radius:4px;background:var(--accent-soft)}
.bubble .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubble .tr{display:none;color:var(--muted);font-size:15px}
.bubble.shown .tr{display:block}
.reply-cue{margin:4px 0 -8px;font-weight:700}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 24px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 3px 0 var(--accent-2)}
.mic svg{width:24px;height:24px}
.mic.on{background:var(--bad);box-shadow:0 3px 0 var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.heard{margin:0;min-height:1.5em;color:var(--muted)}
.w{border-bottom:2px dotted var(--muted);cursor:help;border-radius:2px}
.w:hover,.w.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.cue{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.tip{position:fixed;z-index:40;max-width:260px;background:var(--ink);color:var(--bg);font-family:var(--body);font-size:15px;line-height:1.35;padding:7px 11px;border-radius:8px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* check bar */
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.checkbar-in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
#bar-msg{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--muted)}
#bar-msg:empty{display:none}
#bar-btn{flex:1 1 160px}
.checkbar.good{background:var(--good-bg);border-color:var(--good)}
.checkbar.good #bar-msg{color:var(--good)}
.checkbar.good #bar-btn{background:var(--good);color:var(--surface);box-shadow:0 3px 0 var(--ink)}
.checkbar.bad{background:var(--bad-bg);border-color:var(--bad)}
.checkbar.bad #bar-msg{color:var(--bad)}
.checkbar.bad #bar-btn{background:var(--bad);color:var(--surface);box-shadow:0 3px 0 var(--ink)}
.verdict{font-family:var(--display);font-weight:400;font-size:22px}
.mean{color:var(--ink);font-style:italic}

/* done */
.done-card{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.done-card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.15}
.done-note{margin:0;color:var(--muted)}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.done-stats div{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.done-stats dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.done-stats dd{margin:0;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.missed h3,.sheet-body h3{font-family:var(--display);font-weight:400;font-size:20px;margin:6px 0 8px}
.missed ul,.vocab{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.missed li,.vocab li{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.m-es{font-weight:700} .m-en{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,32,.5);display:flex;justify-content:center;align-items:flex-end}
.sheet-panel{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:28px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.tip{background:var(--surface);border-radius:var(--r);padding:4px 18px;max-width:65ch}
.tip i{font-style:normal;font-weight:700;color:var(--accent)}
.vt-wrap{overflow-x:auto}
.vt{border-collapse:collapse;min-width:280px;background:var(--surface);border-radius:var(--r);overflow:hidden}
.vt caption{text-align:left;font-weight:700;padding:0 0 6px}
.vt th,.vt td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
.vt th{color:var(--muted);font-weight:400}
.vt td{font-weight:700}
.field{display:grid;gap:8px;justify-items:start}
.field>label{font-weight:700}
.range{display:flex;align-items:center;gap:12px;width:100%}
.range input{flex:1;accent-color:var(--accent)}
select{padding:8px 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.switch{display:flex;gap:12px;align-items:flex-start;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.switch small{display:block;font-weight:400;color:var(--muted)}
.small{font-size:14px;color:var(--muted);margin:0}
textarea{width:100%;border-radius:8px;border:2px solid var(--line);background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.status{margin:0;font-weight:700;color:var(--accent);min-height:1.5em}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-bg);border-radius:var(--r);padding:12px}
.confirm span{flex:1 1 200px;color:var(--bad);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head>
<body>
<main>
  <section id="home" aria-label="Course"></section>

  <section id="lesson" hidden aria-label="Lesson">
    <div class="lesson-top">
      <button id="close-lesson" class="icon-btn" type="button" aria-label="Quit lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="track" aria-hidden="true"><span id="bar-fill"></span></div>
    </div>
    <div id="quit" class="quit" hidden>
      <span>Quit this lesson? Answers so far still count toward your reviews.</span>
      <button id="quit-keep" class="btn small soft" type="button">Keep going</button>
      <button id="quit-go" class="btn small text" type="button">Quit</button>
    </div>
    <div id="stage" aria-live="polite"></div>
    <div id="checkbar" class="checkbar">
      <div class="checkbar-in">
        <div id="bar-msg" role="status"></div>
        <button id="bar-btn" class="btn primary" type="button" disabled>Check</button>
      </div>
    </div>
  </section>

  <section id="done" hidden aria-label="Results"></section>
</main>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-head"><h2 id="sheet-title"></h2>

<p>Accent marks matter: <i>sí</i> means yes, <i>si</i> means if. Ruta forgives a missing accent but points it out.</p>

{ id:'describir', es:'Describir', en:'Describing things', band:'A2',

{ id:'pasado', es:'El pasado', en:'The past tense', band:'B1', verbs:['hablar|pret','comer|pret','ir|pret','hacer|pret','tener|pret'],

<p>The accent changes the meaning: <i>hablo</i> = I speak, <i>habló</i> = he spoke.</p>

{ id:'gustos', es:'Gustos', en:'Likes with "gustar"', band:'B1',

<script>
/* Ruta Spanish — learning engine. Needs course.js loaded first. */
'use strict';

/* ---------- constants ---------- */
const DAY = 864e5;

const LEVEL_TYPES = {

  2: ['mc_en2es','tiles_en2es','tiles_es2en','type_w','type_w','fill','listen_w','conj','conj','dlg','match'],
  3: ['type_w','type_s','type_s','listen_s','speak','conj','conj','tiles_en2es','dlg','fill','listen_w']
};
const TYPES = {
  mc_es2en:{k:['w','s']}, mc_en2es:{k:['w']}, listen_mc:{k:['w'],audio:1}, match:{k:['w']},
  tiles_es2en:{k:['s']}, tiles_en2es:{k:['s']}, fill:{k:['s']}, type_w:{k:['w']}, type_s:{k:['s']},
  listen_w:{k:['w'],audio:1}, listen_s:{k:['s'],audio:1}, speak:{k:['s'],mic:1}, conj:{k:['v']}, dlg:{k:['d']}
};

/* ---------- state ---------- */
function fresh(){ return { v:1, units:{}, srs:{}, xp:0, today:{d:'',xp:0}, streak:{n:0,last:''},
  settings:{ rate:0.9, goal:30, speak:true, sfx:true }, stats:{ answers:0, correct:0 } }; }
let S = fresh();
function load(){ try { const r = localStorage.getItem(STORE); if (r) adopt(JSON.parse(r)); } catch(e){} }

function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} }
function dstr(t){ const d = new Date(t == null ? Date.now() : t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayXP(){ return S.today.d === dstr() ? S.today.xp : 0; }
function addXP(n){ const t = dstr(); if (S.today.d !== t) S.today = { d:t, xp:0 }; S.today.xp += n; S.xp += n; }
function bumpStreak(){ const t = dstr(); if (S.streak.last === t) return; S.streak.n = S.streak.last === dstr(Date.now()-DAY) ? S.streak.n + 1 : 1; S.streak.last = t; }
function streakNow(){ return (S.streak.last === dstr() || S.streak.last === dstr(Date.now()-DAY)) ? S.streak.n : 0; }
function rec(key, ok){
  const now = Date.now(); const r = S.srs[key] || { b:0, d:now, r:0, w:0 };
  if (ok){ r.b = Math.min(r.b + 1, 6); r.r++; r.d = now + INT[r.b]*DAY; }
  else   { r.b = 0; r.w++; r.d = now + 10*60e3; }
  S.srs[key] = r; S.stats.answers++; if (ok) S.stats.correct++;

const box = k => S.srs[k] ? S.srs[k].b : -1;

/* ---------- course index ---------- */
function parse(str){

  if (ti >= 0){ hint = s.slice(ti+3).trim(); s = s.slice(0, ti); }
  const p = s.split(' = ');
  return { es:p[0].split('|').map(x=>x.trim()), en:p[1].split('|').map(x=>x.trim()), hint };
}
const ITEMS = {}, UNIT_ITEMS = {};
COURSE.forEach((u, ui) => {
  const list = [];
  u.words.forEach((w,i) => list.push(Object.assign(parse(w), { key:`${u.id}|w|${i}`, kind:'w', u:ui })));
  u.sents.forEach((w,i) => list.push(Object.assign(parse(w), { key:`${u.id}|s|${i}`, kind:'s', u:ui })));
  if (u.dlg){
    u.lines = u.dlg.map(l => { const c = l.indexOf(': '); return Object.assign(parse(l.slice(c+2)), { who:l.slice(0,c) }); });
    u.lines.forEach((l,i) => { if (i > 0) list.push(Object.assign({}, l, { key:`${u.id}|d|${i}`, kind:'d', u:ui, li:i })); });
  }
  (u.verbs || []).forEach(vk => { const [v,t] = vk.split('|');
    DRILL_P.forEach(p => list.push({ key:`${u.id}|v|${v}|${t}|${p}`, kind:'v', u:ui, verb:v, tense:t, p, es:[VERBS[vk][p]], en:[`${v} (${TENSES[t]}), ${PERSONS[p]}`], hint:'' }));
  });
  list.forEach(it => ITEMS[it.key] = it); UNIT_ITEMS[u.id] = list;
});
const ALL = Object.values(ITEMS);
const WG = {};
ALL.filter(i => i.kind === 'w').forEach(i => {
  const k = i.es[0].replace(/[¿¡?!.,;:]/g,'').toLowerCase().trim(), g = i.en[0];
  if (!k.includes(' ')) { if (!GLOSS[k]) WG[k] = g; }
  else { const m = k.match(/^(el|la|los|las) ([^ ]+)$/); if (m){ if (!GLOSS[m[2]]) WG[m[2]] = g.replace(/^the /,''); } else if (!PHRASES[k]) PHRASES[k] = g; }
});

const lvl = i => S.units[COURSE[i].id] || 0;
const unlocked = i => i === 0 || lvl(i-1) >= 1 || lvl(i) >= 1;
function maxU(){ let m = 0; COURSE.forEach((u,i) => { if (unlocked(i)) m = i; }); return m; }
function dueItems(){ const now = Date.now(); return ALL.filter(i => S.srs[i.key] && S.srs[i.key].d <= now); }
function weakItems(){ return ALL.filter(i => { const r = S.srs[i.key]; return r && r.w > 0 && r.b < 3; }); }
function learnedWords(){ return ALL.filter(i => i.kind === 'w' && box(i.key) >= 2).length; }

/* ---------- text helpers ---------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[’']/g,'').replace(/[¿¡?!.,;:"“”«»()]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim(); }
function deacc(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function clean(w){ return w.replace(/[¿¡?!.,;:]/g,''); }
function tok(s){ const t = s.split(/\s+/).map(clean).filter(Boolean); if (t.length && !NAMES.has(t[0]) && !/^I'/.test(t[0])) t[0] = t[0].charAt(0).toLowerCase() + t[0].slice(1); return t; }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const PRON = /^(yo|tú|él|ella|nosotros|nosotras|ellos|ellas|usted|ustedes) /;
function variants(s, es){ const v = [norm(s)]; if (es){ const m = v[0].replace(PRON,''); if (m !== v[0]) v.push(m); } return v; }

function gradeText(input, answers, es){
  const n = norm(input); if (!n) return { ok:false };
  const ins = variants(input, es);
  const pairs = []; answers.forEach(a => variants(a, es).forEach(y => ins.forEach(x => pairs.push([x,y,a]))));
  for (const [x,y] of pairs) if (x === y) return { ok:true };
  for (const [x,y,a] of pairs) if (deacc(x) === deacc(y)) return { ok:true, note:'Watch the accents: <b>'+esc(a)+'</b>' };
  if (es) for (const a of answers){ const m = norm(a).match(/^(el|la|los|las|un|una) (.+)$/); if (m && deacc(n) === deacc(m[2])) return { ok:true, note:'Remember the article: <b>'+esc(a)+'</b>' }; }
  for (const [x,y,a] of pairs){ const L = y.length, allow = L >= 16 ? 2 : L >= 6 ? 1 : 0; if (allow && lev(deacc(x), deacc(y)) <= allow) return { ok:true, note:'Small typo. Correct spelling: <b>'+esc(a)+'</b>' }; }
  return { ok:false };
}
function gradeStrict(input, answers){
  const n = norm(input); if (!n) return { ok:false };
  if (answers.some(a => norm(a) === n)) return { ok:true };
  if (answers.some(a => deacc(norm(a)) === deacc(n))) return { ok:false, note:'Close, but the accent changes the meaning here.' };
  return { ok:false };
}
function gradeExact(input, answers){ const n = norm(input); return { ok: answers.some(a => norm(a) === n) }; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }

/* ---------- exercise factory ---------- */
function distract(item, field, n, kinds){
  const ans = new Set(item[field].map(x => deacc(norm(x))));
  const same = UNIT_ITEMS[COURSE[item.u].id].filter(i => kinds.includes(i.kind) && i.key !== item.key);
  const all = ALL.filter(i => kinds.includes(i.kind) && i.u <= Math.max(maxU(), item.u) && i.key !== item.key);
  const out = [], seenN = new Set(ans);
  for (const src of [shuffle(same), shuffle(all)]) for (const i of src){
    if (out.length >= n) break;
    const ks = i[field].map(x => deacc(norm(x)));
    if (ks.some(k => seenN.has(k))) continue;
    ks.forEach(k => seenN.add(k)); out.push(i[field][0]);
  }
  return out;
}
function makeEx(type, item){
  const ex = { type, item, items:[item] };
  const u = COURSE[item.u];
  switch (type){
    case 'mc_es2en': return Object.assign(ex, { t:'mc', label:'What does this mean?', show:item.es[0], audio:item.es[0],
      options:shuffle([item.en[0], ...distract(item,'en',3,[item.kind])]), answers:item.en, reveal:null });
    case 'mc_en2es': return Object.assign(ex, { t:'mc', label:'Choose the Spanish', show:item.en[0], hint:item.hint,
      options:shuffle([item.es[0], ...distract(item,'es',3,[item.kind])]), answers:item.es, optAudio:true });
    case 'listen_mc': return Object.assign(ex, { t:'mc', label:'Tap what you hear', listen:item.es[0],
      options:shuffle([item.es[0], ...distract(item,'es',3,['w'])]), answers:item.es, reveal:item.en[0] });
    case 'match': {
      const set = [item], ens = new Set(item.en.map(norm)), ess = new Set(item.es.map(norm));
      for (const o of shuffle(UNIT_ITEMS[u.id].filter(i => i.kind === 'w' && i.key !== item.key))){
        if (set.length >= 5) break;

    }

/* ---------- session builders ---------- */
function buildLesson(ui, level, test){

  const used = {}, seen = new Set(), out = [];

  let count = 0, guard = 0;
  while (count < n && guard++ < 400){
    const type = forced.length ? forced.shift() : pick(types);
    if (!canDo(type)) continue;
    const kinds = TYPES[type].k;
    let cands = pool.filter(i => kinds.includes(i.kind));
    if (level >= 2 && !test && Math.random() < 0.2){ const rc = older.filter(i => kinds.includes(i.kind)); if (rc.length) cands = rc; }
    if (!cands.length) continue;
    const scored = cands.map(i => [i, (used[i.key]||0)*10 + (box(i.key) < 0 && !seen.has(i.key) ? -3 : Math.max(0,box(i.key))) + Math.random()*2.5]);
    scored.sort((a,b) => a[1]-b[1]);

    used[item.key] = (used[item.key]||0) + 1;
    if (!test) for (const it of ex.items) if (it.kind === 'w' && box(it.key) < 0 && !seen.has(it.key)) out.push({ t:'intro', item:it, items:[it] });
    ex.items.forEach(it => seen.add(it.key));

}

function rMatch(ex, st){
  const left = shuffle(ex.items), right = shuffle(ex.items);
  let selL = null, selR = null, mistakes = 0, matched = 0; const penal = new Set();
  const L = h('div', { class:'col' }), Rr = h('div', { class:'col' });
  const lb = left.map(it => h('button', { class:'pair', type:'button', lang:'es', onclick:(e) => { say(it.es[0]); selL = { it, b:e.currentTarget }; mark(); try2(); } }, it.es[0]));
  const rb = right.map(it => h('button', { class:'pair', type:'button', lang:'en', onclick:(e) => { selR = { it, b:e.currentTarget }; mark(); try2(); } }, it.en[0]));
  function mark(){ lb.concat(rb).forEach(b => b.setAttribute('aria-pressed', String((selL && selL.b === b) || (selR && selR.b === b)))); }
  function try2(){
    if (!selL || !selR) return;
    const a = selL, b = selR; selL = selR = null;
    if (a.it.key === b.it.key){
      a.b.disabled = b.b.disabled = true; a.b.classList.add('done'); b.b.classList.add('done');
      if (!penal.has(a.it.key)) rec(a.it.key, true); matched++;
      if (matched === ex.items.length){ save(); ctx.ready = true; resolve({ ok: mistakes === 0, noRecord:true }); }
    } else {
      mistakes++; if (!penal.has(a.it.key)){ penal.add(a.it.key); rec(a.it.key, false); Q.missed.add(a.it.key); }
      [a.b, b.b].forEach(x => { x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 400); }); sfx(false);
    }
    mark();
  }
  L.append(...lb); Rr.append(...rb);
  st.append(h('div', { class:'ex' }, head(ex), h('div', { class:'match' }, L, Rr)));
  ctx = { ready:false, check:() => ({ ok: mistakes === 0, noRecord:true }) };
}
function rSpeak(ex, st){
  const out = h('p', { class:'heard', 'aria-live':'polite' }, '');
  let rec1 = null, listening = false, said = '';
  const mic = h('button', { class:'mic', type:'button', html:ICON.mic + '<span>Tap and speak</span>', onclick:() => {
    if (phase !== 'answer') return;
    if (listening){ try { rec1.stop(); } catch(e){} return; }
    try { rec1 = new SR(); } catch(e){ micBlocked = true; return skip('Speech recognition is not available in this browser.'); }
    rec1.lang = 'es-ES'; rec1.interimResults = false; rec1.maxAlternatives = 3;
    rec1.onresult = (e) => { const alts = [...e.results[0]].map(r => r.transcript); said = alts[0];
      out.innerHTML = 'You said: <b lang="es">' + esc(said) + '</b>'; ctx.best = alts; ctx.ready = true; syncBar(); };
    rec1.onerror = (e) => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)){ micBlocked = true; skip('The microphone isn\'t available here. Speaking practice works on your own site in Chrome or Edge.'); }
      else out.textContent = 'Didn\'t catch that. Tap and try again.'; };
    rec1.onend = () => { listening = false; mic.classList.remove('on'); };
    try { rec1.start(); listening = true; mic.classList.add('on'); out.textContent = 'Listening…'; } catch(e){ out.textContent = 'Couldn\'t start the microphone.'; }
  } });
  function skip(msg){ Q.noSpeak = true; ctx.ready = true; resolve({ skip:true, msg }); }
  st.append(h('div', { class:'ex' }, head(ex),
    h('div', { class:'big-row' }, h('span', { class:'big long', lang:'es' }, glossify(ex.show)), audioBtns(ex.show)),
    h('p', { class:'hint en' }, ex.en), mic, out,
    h('button', { class:'btn text', type:'button', onclick:() => skip('Speaking is off for the rest of this session.') }, 'Can\'t talk right now')));
  ctx = { ready:false, best:[], check:() => {
    const want = deacc(norm(ex.answers[0])).split(' ');
    let bestScore = 0;
    for (const a of ctx.best){ const got = deacc(norm(a)).split(' '); const hit = want.filter(w => got.includes(w)).length; bestScore = Math.max(bestScore, hit / want.length); }
    return bestScore >= 0.75 ? { ok:true, note: bestScore < 1 ? 'Close enough. Listen once more to polish it.' : '' } : { ok:false, note:'Try to say every word. Tap play to hear it again.' };
  } };
}

/* ---------- word hints ---------- */
function glossify(text){
  const out = []; const words = String(text || '').split(/\s+/).filter(Boolean);
  let i = 0;
  while (i < words.length){
    let n = 1, g = null;
    for (let k = Math.min(4, words.length - i); k >= 2; k--){
      const key = words.slice(i, i+k).map(w => clean(w).toLowerCase()).join(' ');
      if (PHRASES[key]){ n = k; g = PHRASES[key]; break; }
    }
    if (!g){ const k = clean(words[i]).toLowerCase(); g = GLOSS[k] || WG[k] || null; }
    const raw = words.slice(i, i+n).join(' ');
    const lead = raw.match(/^[¿¡]*/)[0], trail = raw.match(/[?!.,;:]*$/)[0], core = raw.slice(lead.length, raw.length - trail.length);
    if (lead) out.push(lead);
    out.push(g && core ? h('span', { class:'w', tabindex:'0', 'data-g':g }, core) : core);
    if (trail) out.push(trail);
    i += n; if (i < words.length) out.push(' ');
  }
  return h('span', { class:'gl', lang:'es' }, out);
}
let tipFor = null;
function showTip(el){
  const t = $('#tip'); t.textContent = el.getAttribute('data-g'); t.hidden = false; tipFor = el;
  document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on')); el.classList.add('on');
  const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight, vw = document.documentElement.clientWidth;
  let top = r.top - th - 8; if (top < 8) top = r.bottom + 8;
  const left = Math.max(8, Math.min(vw - tw - 8, r.left + r.width/2 - tw/2));
  t.style.top = top + 'px'; t.style.left = left + 'px';
}
function hideTip(){ const t = document.getElementById('tip'); if (t) t.hidden = true; tipFor = null; document.querySelectorAll('.w.on').forEach(x => x.classList.remove('on')); }
function wireTips(){
  let touch = false;
  document.addEventListener('touchstart', () => { touch = true; }, { passive:true });
  document.addEventListener('mouseover', e => { if (touch) return; const w = e.target.closest && e.target.closest('.w'); if (w) showTip(w); });
  document.addEventListener('mouseout', e => { if (touch) return; const w = e.target.closest && e.target.closest('.w'); if (w && !w.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('w')) showTip(e.target); });
  document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('w')) hideTip(); });
  document.addEventListener('click', e => { const w = e.target.closest && e.target.closest('.w');
    if (w){ showTip(w); say(w.textContent); } else hideTip(); });
  window.addEventListener('scroll', hideTip, { passive:true });
}

function backupCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function openSettings(){

      catch(e){ code.select(); status.textContent = 'Press Ctrl+C or Cmd+C to copy.'; } } }, 'Copy backup code'),
    restore, h('button', { class:'btn small soft', type:'button', onclick:() => {

/* ---------- boot ---------- */
function boot(){
  load(); pickVoice();
  if (TTS && 'onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;
  wireTips();
  $('#bar-btn').addEventListener('click', onBar);
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#close-lesson').addEventListener('click', () => { $('#quit').hidden = false; $('#quit-keep').focus(); });
  $('#quit-keep').addEventListener('click', () => $('#quit').hidden = true);
  $('#quit-go').addEventListener('click', () => { save(); Q = null; renderHome(); show('home'); });
  document.addEventListener('keydown', e => {
    if (!$('#sheet').hidden){ if (e.key === 'Escape') closeSheet(); return; }
    if (!Q || $('#lesson').hidden) return;
    const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Enter'){ if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'bar-btn' && phase === 'answer') return; e.preventDefault(); onBar(); }
    else if (!typing && phase === 'answer' && /^[1-9]$/.test(e.key)){ const b = $('#stage [data-k="'+e.key+'"]'); if (b) b.click(); }
  });
  renderHome(); show('home');
}
if (typeof document !== 'undefined' && document.getElementById('home')) boot();
